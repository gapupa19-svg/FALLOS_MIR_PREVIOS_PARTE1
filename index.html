 enfermo de 28 años con un cuadro de 9 meses de evolución de dolor lumbar bajo asociado a rigidez matutina de 60 minutos, que mejora con el ejercicio o la actividad. Hace unas semanas comenzó con dolor, tumefacción y limitación funcional en rodilla izquierda, tobillo derecho y “dedo en salchicha” en el tercer dedo de la mano derecha. Tras la toma de antiinflamatorios no esteroideos, ha mejorado solo discretamente. En este momento, indique cuál de las siguientes afirmaciones es cierta:", "opts": {"A": "La positividad del antígeno HLA-B27 hará seguro el diagnóstico de espondilitis anquilosante.", "B": "Los corticoides orales serán una parte importante del tratamiento en este paciente.", "C": "Una radiografía anteroposterior de pelvis y de columna lumbar aportará poco en este caso.", "D": "La sulfasalazina será una parte importante del tratamiento en este paciente.", "E": "La uveítis posterior es relativamente frecuente en el curso evolutivo de estos pacientes."}, "correct": "D", "wrong": "B", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 145, "pg": [157], "temaKey": "Reumatología", "temaLabel": "Reumatología", "meta": "", "stem": "Un paciente de 22 años refiere una historia de 15 meses de dolor lumbar bajo y en nalgas, que le despierta a medianoche y es más intenso al despertarse por la mañana. Radiológicamente se aprecia ensanchamiento, erosiones y esclerosis en ambas articulaciones sacroilíacas. Señale cuál de las siguientes afirmaciones es INCORRECTA en relación con este cuadro:", "opts": {"A": "El factor reumatoide puede ser positivo.", "B": "Puede presentar uveítis aguda.", "C": "Puede presentar monoartritis de rodilla.", "D": "El reposo no suele mejorar estos síntomas.", "E": "Puede tener inflamación en inserciones tendinosas."}, "correct": "A", "wrong": "C", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 146, "pg": [158], "temaKey": "Reumatología", "temaLabel": "Reumatología", "meta": "", "stem": "Entre la espondilitis anquilosante y el antígeno de histocompatibilidad HLA-B27 existe una fuerte asociación. ¿Cuál de las afirmaciones siguientes es correcta?", "opts": {"A": "La mitad de las personas HLA-B27 positivas tienen sacroileítis o espondilitis.", "B": "Las personas de raza negra o de origen asiático tienen una mayor prevalencia de espondilitis anquilosante y de antígeno HLA-B27.", "C": "Alrededor de un 10% de los casos de espondilitis anquilosante no se asocia al antígeno HLA-B27.", "D": "La tasa de concordancia en gemelos idénticos es casi el 100%.", "E": "En una persona con dolor lumbosacro, la positividad del antígeno HLA-B27 confirma el diagnóstico de espondilitis anquilosante."}, "correct": "C", "wrong": "D", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 147, "pg": [159], "temaKey": "Reumatología", "temaLabel": "Reumatología", "meta": "", "stem": "La artritis psoriásica puede presentar distintas formas, que corresponden a todas las siguientes, EXCEPTO:", "opts": {"A": "Afectación de las articulaciones interfalángicas distales.", "B": "Artritis mutilante.", "C": "Inflamación de los tendones e inserciones ligamentosas en el hueso.", "D": "Sacroileítis asimétrica unilateral.", "E": "Poliartritis simétrica con nódulos subcutáneos."}, "correct": "E", "wrong": "A", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 148, "pg": [160], "temaKey": "Reumatología", "temaLabel": "Reumatología", "meta": "", "stem": "En relación con la artritis reactiva asociada a HLA-B27, señale cuál de los siguientes microorganismos se asocia a una artritis infecciosa específica más que a una artritis reactiva clásica:", "opts": {"A": "Shigella flexneri.", "B": "Yersinia enterocolitica.", "C": "Chlamydia trachomatis.", "D": "Campylobacter jejuni.", "E": "Borrelia burgdorferi."}, "correct": "E", "wrong": "C", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 149, "pg": [161], "temaKey": "Reumatología", "temaLabel": "Reumatología", "meta": "", "stem": "¿En cuál de los siguientes procesos el metotrexato constituye el fármaco antirreumático modificador de la enfermedad (FAME) convencional de primera elección?", "opts": {"A": "Artrosis.", "B": "Artritis psoriásica.", "C": "Artropatía de la hemocromatosis.", "D": "Espondilitis anquilosante.", "E": "Síndrome de Behcet."}, "correct": "B", "wrong": "D", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 150, "pg": [162], "temaKey": "Reumatología", "temaLabel": "Reumatología", "meta": "", "stem": "Las articulaciones más frecuentemente afectadas en la artritis psoriásica son las:", "opts": {"A": "Interfalángicas proximales.", "B": "Interfalángicas distales.", "C": "Metacarpofalángicas.", "D": "Articulaciones de los codos.", "E": "Articulaciones de las rodillas."}, "correct": "B", "wrong": "A", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 151, "pg": [163], "temaKey": "Reumatología", "temaLabel": "Reumatología", "meta": "", "stem": "Según los criterios de clasificación ACR/EULAR 2019 del lupus eritematoso sistémico, ¿cuál de los siguientes NO forma parte de los criterios clínicos o inmunológicos ponderados?", "opts": {"A": "Anticuerpos antinucleares positivos a título >1:80.", "B": "Lupus cutáneo agudo.", "C": "Anemia hemolítica autoinmune.", "D": "Pericarditis aguda.", "E": "Anticuerpos anti-ADN de doble cadena."}, "correct": "A", "wrong": "D", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 152, "pg": [164], "temaKey": "Reumatología", "temaLabel": "Reumatología", "meta": "", "stem": "Mujer de 25 años que presenta un cuadro de 2 meses de evolución de artritis simétrica en manos, erupción fotosensible, hipertensión arterial y febrícula. Analítica: hemograma con 3.500 leucocitos/uL, plaquetas 85.000/uL, creatinina y transaminasas normales. Anticuerpos antinucleares positivos 1/320, anti-ADN nativo positivo e hipocomplementemia. ¿Cuál de las siguientes pruebas aportaría información más relevante para el manejo de este caso?", "opts": {"A": "Radiografía de manos.", "B": "Determinación de anticuerpos antipéptido cíclico citrulinado.", "C": "Determinación de anticuerpos anti Sm.", "D": "Sistemático de orina.", "E": "Aspirado de médula ósea."}, "correct": "D", "wrong": "C", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 153, "pg": [165], "temaKey": "Reumatología", "temaLabel": "Reumatología", "meta": "", "stem": "Respecto al tratamiento del Lupus eritematoso sistémico señale, entre las siguientes, la respuesta INCORRECTA:", "opts": {"A": "Se deben utilizar glucocorticoides a dosis altas y fármacos citotóxicos en los casos de afectación orgánica grave potencialmente reversible.", "B": "Los fármacos antipalúdicos son eficaces para el control de formas leves-moderadas de la enfermedad, siendo recomendable vigilar periódicamente la posible toxicidad retiniana.", "C": "En períodos de inactividad de la enfermedad es posible prescindir del tratamiento, aunque las remisiones completas son raras.", "D": "En caso de insuficiencia renal terminal deben recibir tratamiento con diálisis, estando contraindicado el trasplante renal de cadáver.", "E": "Las complicaciones infecciosas son un riesgo importante en los pacientes que reciben tratamiento inmunosupresor."}, "correct": "D", "wrong": "C", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 154, "pg": [166], "temaKey": "Reumatología", "temaLabel": "Reumatología", "meta": "", "stem": "Señale cuál de las siguientes es la manifestación clínica más frecuente en el lupus eritematoso sistémico:", "opts": {"A": "Artralgias/mialgias.", "B": "Fotosensibilidad.", "C": "Anemia.", "D": "Erupción malar.", "E": "Pleuresía."}, "correct": "A", "wrong": "B", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 155, "pg": [167], "temaKey": "Reumatología", "temaLabel": "Reumatología", "meta": "", "stem": "Una joven de 22 años ha sido diagnosticada de lupus eritematoso sistémico (LES) recientemente. ¿Cuál de las siguientes afirmaciones acerca de esta paciente es cierta?", "opts": {"A": "Casi con seguridad padecerá artritis o artralgias, que son las manifestaciones clínicas más frecuentes en estos pacientes.", "B": "La probabilidad de que tenga anticuerpos antinucleares detectables en el suero es menor del 50%.", "C": "No es aconsejable que se quede embarazada porque casi todas las pacientes con LES abortan.", "D": "Se debe tratar con 1 mg/kg peso/día de prednisona por vía oral aunque esté asintomática.", "E": "En su suero se detectarán anticuerpos anti-ADN porque más del 95% de los pacientes con LES presentan estos anticuerpos."}, "correct": "A", "wrong": "E", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 156, "pg": [168], "temaKey": "Reumatología", "temaLabel": "Reumatología", "meta": "", "stem": "El denominado lupus neonatal se asocia a la presencia de anticuerpos séricos:", "opts": {"A": "Anti-Ro (SSA).", "B": "Anti-Sm.", "C": "Anti-ADN bicatenario.", "D": "Anti-histona.", "E": "Anti-centrómero."}, "correct": "A", "wrong": "B", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 157, "pg": [169], "temaKey": "Reumatología", "temaLabel": "Reumatología", "meta": "", "stem": "Los pacientes con lupus cutáneo subagudo constituyen un subgrupo dentro del lupus caracterizado por:", "opts": {"A": "Alta incidencia de lesiones proliferativas.", "B": "Las lesiones cutáneas, característicamente, no son fotosensibles.", "C": "Alta frecuencia de artritis y fotosensibilidad.", "D": "Cursa con niveles normales de complemento y anticuerpos anti-Ro negativos.", "E": "Es casi exclusivo de la edad pediátrica."}, "correct": "C", "wrong": "B", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 158, "pg": [170], "temaKey": "Reumatología", "temaLabel": "Reumatología", "meta": "", "stem": "En un paciente que consulta por xerostomía y xeroftalmia, ¿cuál de los siguientes resultados de las exploraciones complementarias NO es concordante con un diagnóstico de síndrome de Sjógren primario?", "opts": {"A": "Presencia de anticuerpos anti-Ro y anti-La positivos en suero.", "B": "Test de Schirmer patológico que demuestra la presencia de hiposecreción lagrimal.", "C": "Ulceraciones orales con apariencia de aftas.", "D": "Tinción corneal con fluoresceína que muestra queratoconjuntivitis punctata.", "E": "Biopsia de glándula salival menor con presencia de acúmulos focales linfoplasmocitarios."}, "correct": "C", "wrong": "A", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 159, "pg": [171], "temaKey": "Reumatología", "temaLabel": "Reumatología", "meta": "", "stem": "Respecto a la arteritis de células gigantes, clásicamente llamada arteritis temporal, señale la respuesta INCORRECTA:", "opts": {"A": "Se presenta fundamentalmente en personas de ascendencia europea y mayores de 50 años.", "B": "Aproximadamente una cuarta parte de los pacientes desarrollan aneurisma o dilatación de la aorta torácica.", "C": "La pérdida de visión unilateral o bilateral es una de sus complicaciones más graves.", "D": "La máxima incidencia se da entre la sexta y la séptima década de la vida."}, "correct": "D", "wrong": "B", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 160, "pg": [172], "temaKey": "Reumatología", "temaLabel": "Reumatología", "meta": "", "stem": "Señalar cuál de las siguientes manifestaciones NO es característica de la vasculitis IgA:", "opts": {"A": "Púrpura.", "B": "Trombocitopenia.", "C": "Artralgias.", "D": "Nefropatía.", "E": "Dolor abdominal."}, "correct": "B", "wrong": "D", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 161, "pg": [173], "temaKey": "Reumatología", "temaLabel": "Reumatología", "meta": "", "stem": "Señale lo correcto respecto a la polimialgia reumática:", "opts": {"A": "Existe predominio masculino.", "B": "La existencia de fiebre debe hacer rechazar el diagnóstico.", "C": "La fosfatasa alcalina se encuentra comúnmente elevada.", "D": "El tratamiento con antiinflamatorios no esteroideos es siempre ineficaz.", "E": "El tratamiento esteroideo debe mantenerse un mínimo de 6 meses."}, "correct": "C", "wrong": "A", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 162, "pg": [174], "temaKey": "Reumatología", "temaLabel": "Reumatología", "meta": "", "stem": "En el binomio polimialgia reumática-arteritis de células gigantes, ¿cuál de los siguientes datos nos hará sospechar la presencia de vasculitis?", "opts": {"A": "La existencia de fiebre.", "B": "La edad avanzada del paciente.", "C": "La presencia de claudicación mandibular.", "D": "Una VSG elevada.", "E": "La constatación de anemia."}, "correct": "C", "wrong": "D", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 163, "pg": [175], "temaKey": "Reumatología", "temaLabel": "Reumatología", "meta": "", "stem": "¿Cuál de los siguientes es el hallazgo radiológico más frecuente en la granulomatosis con poliangeítis?", "opts": {"A": "Derrame pleural.", "B": "Atelectasia segmentaria.", "C": "Adenopatía hiliar.", "D": "Infiltrados focales.", "E": "Nódulos múltiples."}, "correct": "E", "wrong": "D", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 164, "pg": [176], "temaKey": "Reumatología", "temaLabel": "Reumatología", "meta": "", "stem": "La mayor rentabilidad diagnóstica en la granulomatosis con poliangeítis (enfermedad de Wegener) la tiene la biopsia de:", "opts": {"A": "Riñón.", "B": "Mucosa naso-sinusal.", "C": "Piel.", "D": "Pulmón.", "E": "Músculo."}, "correct": "D", "wrong": "B", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 165, "pg": [177], "temaKey": "Reumatología", "temaLabel": "Reumatología", "meta": "", "stem": "¿Cuál de los siguientes hallazgos anatomopatológicos es más específico de la granulomatosis eosinofílica con poliangeítis (GEPA)?", "opts": {"A": "Necrosis fibrinoide de la pared arterial.", "B": "Infiltrado perivascular con presencia de histiocitos y células gigantes.", "C": "Glomerulonefritis necrotizante focal.", "D": "Granulomas necrotizantes extravasculares.", "E": "Afectación de la pared venosa."}, "correct": "D", "wrong": "A", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 166, "pg": [179], "temaKey": "Reumatología", "temaLabel": "Reumatología", "meta": "", "stem": "Entre los factores exógenos que favorecen la aparición de gota están los fármacos. De los siguientes indicados ¿cuál considera usted que NO favorece la hiperuricemia?", "opts": {"A": "El ácido acetilsalicílico a dosis inferiores a 1 g diario.", "B": "La hidroclorotiazida.", "C": "La ciclosporina A.", "D": "El etambutol.", "E": "Los estrógenos."}, "correct": "E", "wrong": "A", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 167, "pg": [180], "temaKey": "Reumatología", "temaLabel": "Reumatología", "meta": "", "stem": "Respecto a la relación entre gota y nefrolitiasis, ¿cuál de las siguientes afirmaciones es cierta?", "opts": {"A": "Todos los individuos con litiasis úricas terminan desarrollando otras manifestaciones de gota.", "B": "El riesgo de litiasis úrica es muy alto cuando la uricosuria es de 400 a 600 mg/día.", "C": "Cuando un individuo gotoso presenta una litiasis úrica, puede asegurarse que ya sufre un deterioro significativo de la función renal.", "D": "La mayoría de los pacientes con litiasis cálcica son gotosos.", "E": "Los gotosos sufren una mayor incidencia de litiasis cálcica que la población no gotosa."}, "correct": "E", "wrong": "B", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 168, "pg": [181], "temaKey": "Neurología", "temaLabel": "Neurología", "meta": "", "stem": "Hombre de 73 años, fumador de 40 cigarrillos al día, diabético e hipertenso mal controlado, sin antecedentes de ictus. Acude a urgencias por un cuadro de 6 horas de evolución que aúna los siguientes síntomas y signos: vértigo, visión doble, ptosis y miosis del ojo izquierdo, disartria, disfagia, ronquera, entumecimiento del lado izquierdo de la cara y de los miembros derechos. La TC craneal muestra una marcada leucoaraiosis. La analítica es anodina. La radiografía de tórax no aporta datos de interés y el ECG muestra un ritmo sinusal y signos de hipertrofia ventricular izquierda. Asumiendo que el paciente tiene un ictus, ¿cuál de las siguientes causas es la única posible?", "opts": {"A": "Disección de la arteria carótida interna izquierda.", "B": "Trombosis de la arteria cerebelosa anteroinferior derecha.", "C": "Trombosis de la arteria cerebelosa posteroinferior derecha.", "D": "Trombosis de la arteria vertebral izquierda.", "E": "Trombosis de la arteria cerebelosa anteroinferior izquierda."}, "correct": "D", "wrong": "C", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 169, "pg": [182], "temaKey": "Neurología", "temaLabel": "Neurología", "meta": "", "stem": "¿Cuál de estos procesos es una manifestación clínica aguda de la enfermedad de pequeño vaso por oclusión de arterias perforantes cerebrales?", "opts": {"A": "Hemorragia lobar.", "B": "Desmielinización isquémica crónica (leucoaraiosis).", "C": "Infarto talámico.", "D": "Neuropatía óptica isquémica.", "E": "Arteritis necrosante."}, "correct": "C", "wrong": "A", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 170, "pg": [183], "temaKey": "Neurología", "temaLabel": "Neurología", "meta": "", "stem": "Un paciente presenta de forma brusca un trastorno del lenguaje caracterizado por lenguaje espontáneo escaso, casi mutismo, dificultad para evocar palabras, muy leve trastorno de la comprensión, repitiendo correctamente. Su primera sospecha diagnóstica será:", "opts": {"A": "Cuadro confusional agudo.", "B": "Accidente isquémico frontal profundo izquierdo.", "C": "Hemorragia subaracnoidea.", "D": "Infarto silviano derecho.", "E": "Lesión del cuerpo calloso."}, "correct": "B", "wrong": "D", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 171, "pg": [184], "temaKey": "Neurología", "temaLabel": "Neurología", "meta": "", "stem": "En un ictus en el territorio de la arteria cerebral anterior, señale cuál de las siguientes afirmaciones NO es correcta:", "opts": {"A": "Es más frecuente que tengan un origen trombótico.", "B": "Se tolera clínicamente bien por la circulación colateral existente.", "C": "En ocasiones, puede afectar a ambos hemisferios.", "D": "El segmento precomunal Al de la arteria da origen a varias ramas perforantes a cápsula interna.", "E": "El infarto en este terreno arterial es raro."}, "correct": "A", "wrong": "D", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 172, "pg": [185], "temaKey": "Neurología", "temaLabel": "Neurología", "meta": "", "stem": "Un hombre de 62 años acude a urgencias por presentar de forma brusca mareo e inestabilidad. En la exploración se encuentra un nistagmo horizontal, un síndrome de Horner derecho, una pérdida de la sensibilidad dolorosa en la hemicara derecha y braquiocrural izquierda, una ataxia de miembros derechos y disfagia. ¿Cuál sería la sospecha diagnóstica?", "opts": {"A": "Infarto de la arteria basilar.", "B": "Infarto de la protuberancia.", "C": "Infarto de la arteria vertebral izquierda.", "D": "Infarto de la arteria cerebral derecha.", "E": "Infarto lateral bulbar derecho."}, "correct": "E", "wrong": "A", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 173, "pg": [186], "temaKey": "Neurología", "temaLabel": "Neurología", "meta": "", "stem": "Señale cuál de las siguientes manifestaciones clínicas NO corresponde a un infarto cerebral por trombosis de la arteria cerebral posterior izquierda:", "opts": {"A": "Hemianopsia homónima derecha de predominio en cuadrantes superiores.", "B": "Dislexia verbal sin agrafia.", "C": "Desorientación topográfica.", "D": "Apraxia de la marcha.", "E": "Alucinaciones visuales no estructuradas o complejas."}, "correct": "D", "wrong": "E", "fig": null, "exp       <div class="stat b"><b>${sess.xp}</b><span>XP</span></div>
      <div class="stat g"><b>${acc}%</b><span>A la primera</span></div>
      <div class="stat r"><b>${misses.length}</b><span>Falladas</span></div>
    </div>
    ${misses.length?`<h2 class="sec" style="text-align:left">A repasar</h2><div class="rlist">${misses.map(id=>{const q=Q(id);return `<div class="ritem"><div class="q">${esc(q.stem.length>170?q.stem.slice(0,170)+'…':q.stem)}</div><b>${q.correct}.</b> ${esc(q.opts[q.correct]||'')}</div>`;}).join('')}</div>`:'<p style="font-size:18px">Cero errores. Así se hace. 🔥</p>'}
    <div class="stack" style="margin-top:22px">
      ${misses.length?'<button class="btn blue" id="again">Repetir las falladas</button>':''}
      <button class="btn" id="homeb">Volver al inicio</button>
    </div>
  </div>`;
  const a=document.getElementById('again');
  if(a)a.onclick=()=>start(shuffle(misses));
  document.getElementById('homeb').onclick=home;
  if(!dead&&acc>=80)burst();
}
function burst(){
  const c=document.createElement('canvas');c.className='confetti';document.body.appendChild(c);
  const W=c.width=innerWidth,H=c.height=innerHeight,x=c.getContext('2d');
  const cols=['#58cc02','#1cb0f6','#ff9600','#ffc800','#ff4b4b'];
  const P=Array.from({length:110},()=>({x:Math.random()*W,y:-20-Math.random()*H*.4,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,s:5+Math.random()*6,c:cols[Math.floor(Math.random()*5)],r:Math.random()*6}));
  let f=0;(function tick(){x.clearRect(0,0,W,H);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=.1;x.fillStyle=p.c;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore();});if(++f<160)requestAnimationFrame(tick);else c.remove();})();
}
document.addEventListener('keydown',e=>{
  if(!sess||!document.getElementById('opts')&&!document.getElementById('next'))return;
  const k=e.key;
  if(!sess.checked){
    const opts=[...$app.querySelectorAll('.opt')];
    if(/^[1-5]$/.test(k)&&opts[+k-1]){select(opts[+k-1].dataset.l);}
    else if(/^[a-eA-E]$/.test(k)){const b=opts.find(o=>o.dataset.l===k.toUpperCase());if(b)select(b.dataset.l);}
    else if(k==='Enter'){check();}
  }else if(k==='Enter'){const n=document.getElementById('next');if(n)n.click();}
});
home();
})();
</script>
</body>
