 ¿cuál de las siguientes afirmaciones es FALSA?", "opts": {"A": "La gravedad de la infección está en relación con el grado de parasitemia.", "B": "La infección por Plasmodium falciparum es la más grave.", "C": "La malaria cerebral es una manifestación típica de Plasmodium vivax.", "D": "El dato analítico más frecuente es una anemia normocítica.", "E": "La infección se ha descrito en adictos a drogas por vía parenteral que comparten jeringuillas."}, "correct": "C", "wrong": "E", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 52, "pg": [52], "temaKey": "Infecciosas", "temaLabel": "Infecciosas", "meta": "MIR 1993 · P201 · 60.6% acierto", "stem": "Un paciente a la vuelta de México, desarrolla fiebre y dolor en hipocondrio derecho. En la ecografía se detecta una imagen hipoecoica de unos 10 cm en el lóbulo hepático derecho. El cultivo del material obtenido por punción-aspiración de la lesión es estéril. ¿Cuál será el tratamiento más correcto?", "opts": {"A": "Drenaje percutáneo + antibióticos de amplio espectro (ceftriaxona + metronidazo!l).", "B": "Metronidazol.", "C": "Metronidazol + ¡odoquinol.", "D": "Exéresis quirúrgica + antibióticos de amplio espectro.", "E": "Emetinai.v. + cloroquina oral."}, "correct": "C", "wrong": "A", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 53, "pg": [54], "temaKey": "Microbiología", "temaLabel": "Microbiología", "meta": "MIR 2001 · P244 · 66.6% acierto", "stem": "¿Cuál es la mejor técnica para el diagnóstico microbiológico de Isospora belli?", "opts": {"A": "Hemocultivo.", "B": "Urocultivo.", "C": "Tinción de ácido-alcohol resistencia.", "D": "Tinción de plata metenamina.", "E": "Tinción de Gram."}, "correct": "C", "wrong": "D", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 54, "pg": [55], "temaKey": "Microbiología", "temaLabel": "Microbiología", "meta": "MIR 1992 · P202 · 74.5% acierto", "stem": "Considerando el conjunto de personas infectadas por Giardia lamblia, incluidas las que NO llegan a desarrollar síntomas, lo más probable es que la infección curse con:", "opts": {"A": "Dolores abdominales.", "B": "Diarrea crónica.", "C": "Malabsorción.", "D": "Eosinofilia.", "E": "Ausencia de síntomas."}, "correct": "E", "wrong": "B", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 55, "pg": [56], "temaKey": "Microbiología", "temaLabel": "Microbiología", "meta": "MIR 1991 · P29 · 73% acierto", "stem": "¿Cuál es la fase infectiva de Cryptosporidium spp.?", "opts": {"A": "Gametos.", "B": "Esquizontes.", "C": "Esporoquistes.", "D": "Ooquistes.", "E": "Merozoítos."}, "correct": "D", "wrong": "E", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 56, "pg": [57, 61], "temaKey": "Infecciosas", "temaLabel": "Infecciosas", "meta": "MIR 2026 · P36", "stem": "Mujer de 44 años con antecedentes de neoplasia de mama en tratamiento con quimioterapia que ingresa en la unidad de cuidados intensivos (UCI) con insuficiencia respiratoria. Requiere intubación y conexión a ventilación mecánica. Se realiza fibrobroncoscopia con lavado broncoalveolar y se aísla Nocardia farcinica pendiente de antibiograma. ¿Qué actitud terapéutica cree correcta?", "opts": {"A": "Iniciar tratamiento con voriconazol más trimetoprim-sulfametoxazo!l.", "B": "Iniciar tratamiento con trimetoprim-sulfametoxazol.", "C": "Iniciar tratamiento con trimetoprim-sulfametoxazol más meropenem.", "D": "Iniciar tratamiento con trimetoprim-sulfametoxazol más imipenem más amikacina."}, "correct": "D", "wrong": "C", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 57, "pg": [58], "temaKey": "Infecciosas", "temaLabel": "Infecciosas", "meta": "MIR 2025 · P192 · 46% acierto", "stem": "Acude a urgencias un hombre de 34 años, sin diagnósticos previos, con antecedente de consumo de drogas por vía parenteral, con fiebre, tos no productiva y disnea progresiva de varias semanas de evolución. Se realiza radiografía de tórax que muestra infiltrado intersticial bilateral. En analítica sanguínea destaca linfopenia y lactato deshidrogenasa elevada. La saturación de oxígeno es del 88 % respirando aire ambiente en reposo. ¿Cuál de las siguientes aseveraciones le parece INCORRECTA?", "opts": {"A": "Iniciaría tratamiento de soporte, oxigenoterapia y ceftriaxona.", "B": "Iniciaría tratamiento con Trimetoprim-sulfametoxazol, corticoides y oxigenoterapia.", "C": "Solicitaría serología del virus de la inmunodeficiencia humana.", "D": "Solicitaría estudio microbiológico de esputo."}, "correct": "A", "wrong": "B", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 58, "pg": [59, 63], "temaKey": "Infecciosas", "temaLabel": "Infecciosas", "meta": "MIR 2000 · P105 · 86.3% acierto", "stem": "Un paciente de 31 años, usuario de drogas por vía parenteral hasta hace 10 años, es traído a Urgencias por su familia con un cuadro de tres días de evolución de fiebre, agitación y, en las últimas horas, disminución del nivel de conciencia. Los familiares refieren que es portador de anticuerpos anti-VIH, pero que nunca ha querido tratarse. Entre otras exploraciones se realiza una TC craneal que muestra una imagen que capta contraste en anillo. Señale cuál de las siguientes afirmaciones es correcta:", "opts": {"A": "La primera posibilidad es linfoma cerebral primario.", "B": "No es preciso iniciar tratamiento hasta conocer su cifra de linfocitos CD4.", "C": "Lo más frecuente es que se trate de una infección aguda por Toxoplasma gondii.", "D": "Es adecuado iniciar tratamiento lo antes posible con sulfadiazina-pirimetamina.", "E": "La serología para Toxoplasma no es útil en esta situación."}, "correct": "D", "wrong": "C", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 59, "pg": [60, 66], "temaKey": "Infecciosas", "temaLabel": "Infecciosas", "meta": "MIR 1993 · P205 · 33.5% acierto", "stem": "Un paciente que fue sometido hace 5 meses a un trasplante renal desarrolla un cuadro febril, con malestar general, artromialgias y destacan: leucocitos de 2.100/pL, plaquetas de 80.000/pL, GOT: 128 UI/L, GPT: 220 UI/L, PO,: 60 mmHg, PCO,: 28 mmHg. En la radiografía de tórax se observan discretos infiltrados intersticiales difusos. La etiología más probable será:", "opts": {"A": "Pneumogcystis jirovecii.", "B": "Citomegalovirus.", "C": "Virus de Epstein-Barr.", "D": "Coxiella burnetii.", "E": "Legionella pneumophila."}, "correct": "B", "wrong": "A", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 60, "pg": [62], "temaKey": "Infecciosas", "temaLabel": "Infecciosas", "meta": "", "stem": "¿Cuál de los siguientes cuadros clínicos NO se asocia con toxoplasmosis?", "opts": {"A": "Abscesos cerebrales en personas con SIDA.", "B": "Miocarditis en trasplantados cardíacos.", "C": "Coriorretinitis en adultos inmunocompetentes.", "D": "Colitis asociada a inmunodeficiencia humoral.", "E": "Síndrome mononucleósico en personas sanas."}, "correct": "D", "wrong": "C", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 61, "pg": [64], "temaKey": "Infecciosas", "temaLabel": "Infecciosas", "meta": "MIR 2000 (F) · P109 · 54.3% acierto", "stem": "Señale cuál de los siguientes gérmenes NO es un patógeno común en pacientes neutropénicos:", "opts": {"A": "Cryptococcus.", "B": "Staphylococcus.", "C": "Pseudomonas.", "D": "Candida.", "E": "Aspergillus."}, "correct": "A", "wrong": "B", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 62, "pg": [65], "temaKey": "Infecciosas", "temaLabel": "Infecciosas", "meta": "MIR 1997 · P118 · 79.2% acierto", "stem": "Varón de 30 años con asplenia quirúrgica por trombocitopenia inmune primaria, que desarrolla en el curso de unas horas cuadro febril. El examen físico muestra, junto a datos hemodinámicos sugerentes de sepsis severa, lesiones necrótico-hemorrágicas de localización periférica en extremidades inferiores y purpúricas de distribución corporal generalizada. Con más probabilidad su cuadro séptico está originado por:", "opts": {"A": "Gérmenes encapsulados virulentos.", "B": "Staphylococcus aureus.", "C": "Rickettsias.", "D": "Hongos invasivos.", "E": "Gérmenes entéricos gram-negativos."}, "correct": "A", "wrong": "C", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 63, "pg": [67], "temaKey": "Cardiología", "temaLabel": "Cardiología", "meta": "", "stem": "Una de las siguientes afirmaciones sobre la epidemiología y el pronóstico de la insuficiencia cardíaca es INCORRECTA, señálela.", "opts": {"A": "Entre el 60 y el 70 % de los pacientes fallecen en los primeros 5 años tras establecerse el diagnóstico de insuficiencia cardíaca.", "B": "La situación funcional del paciente con insuficiencia cardíaca es la que mejor se correlaciona con la expectativa de supervivencia.", "C": "La disfunción diastólica predomina en mujeres de edad avanzada con historia de hipertensión crónica.", "D": "La insuficiencia cardiaca por disfunción sistólica suele objetivarse en pacientes varones afectos de cardiopatía isquémica.", "E": "La prevalencia de la insuficiencia cardíaca está reduciéndose en la última década gracias al mejor control de los factores de riesgo cardiovascular."}, "correct": "E", "wrong": "A", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 64, "pg": [68], "temaKey": "Cardiología", "temaLabel": "Cardiología", "meta": "", "stem": "Mujer de 53 años con antecedentes de obesidad y migraña. En varias mediciones realizadas en consulta médica y de enfermería presenta cifras de presión arterial inferiores a 140/90 mmHg. Se ha comprado un tensiómetro validado para uso domiciliario y se le ha enseñado a utilizarlo correctamente. Acude con registros de presión arterial domiciliaria tomados durante varias semanas, con valores medios superiores a 135/85 mmHg. ¿Cuál de las siguientes afirmaciones es correcta?", "opts": {"A": "Presenta una hipertensión arterial secundaria.", "B": "Presenta una hipertensión arterial enmascarada.", "C": "Presenta una hipertensión clínica aislada.", "D": "Presenta una hipertensión arterial refractaria."}, "correct": "B", "wrong": "A", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 65, "pg": [69], "temaKey": "Cardiología", "temaLabel": "Cardiología", "meta": "", "stem": "Un hombre de 47 años sin antecedentes de interés, es diagnosticado de hipertensión arterial hace un año. Sigue tratamiento con amlodipino 10 mg (1-0-0) y losartán/ hidroclorotiazida 100/25 mg (1-0-0), y realiza dieta hiposódica, con buena adherencia. A pesar de ello tiene cifras de presión arterial de 168/92 mmHg. ¿Cuál es el siguiente paso a realizar?", "opts": {"A": "Añadir un cuarto fármaco.", "B": "Incrementar la dosis de alguno de los que está tomando.", "C": "Realizar una monitorización ambulatoria de la presión arterial (MAPA).", "D": "Realizar un estudio para descartar hipertensión arterial secundaria."}, "correct": "C", "wrong": "D", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 66, "pg": [70], "temaKey": "Cardiología", "temaLabel": "Cardiología", "meta": "", "stem": "Indique cuál de las siguientes afirmaciones es cierta respecto al tratamiento de la hipertensión arterial:", "opts": {"A": "En pacientes obesos la reducción del peso por sí sola no disminuye la presión arterial.", "B": "Los inhibidores de la enzima conversora de la angiotensina (IECA) deben añadirse al tratamiento previo con diuréticos sin interrupción de estos.", "C": "Los antagonistas de los receptores de la angiotensina II no producen hiperpotasemia como efecto secundario, a diferencia de los IECA.", "D": "Los estudios a largo plazo han demostrado que los diuréticos en el tratamiento de la HTA disminuyen la morbimortalidad.", "E": "La taquicardia refleja es un efecto secundario de los antagonistas del calcio no dihidropiridínicos."}, "correct": "D", "wrong": "B", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 67, "pg": [71], "temaKey": "Cardiología", "temaLabel": "Cardiología", "meta": "", "stem": "En la definición de hipertensión arterial resistente, se consideran las siguientes causas, EXCEPTO:", "opts": {"A": "Cifras de presión arterial sistólica por encima de 180 mmHg.", "B": "Apnea obstructiva del sueño.", "C": "Lesión orgánica irreversible o difícilmente reversible.", "D": "Cumplimiento deficiente del plan terapéutico.", "E": "Causa secundaria no sospechada."}, "correct": "A", "wrong": "D", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 68, "pg": [72], "temaKey": "Cardiología", "temaLabel": "Cardiología", "meta": "", "stem": "Nos avisa la enfermera porque al tomar la presión arterial a un hombre de 47 años, que acudía al ambulatorio por las recetas de su madre, presentaba cifras de 160/100 mmHg y a los 15 minutos 164/98 mmhHo. El paciente se encuentra bien, en su historia el último registro es de un catarro hace cuatro años, y no viene reflejado nada llamativo en sus antecedentes personales. ¿Cuál sería la actitud más adecuada?", "opts": {"A": "Administrar nifedipino sublingual y actuar en función de la respuesta.", "B": "Administrar una tiazida y programar para estudio de su hipertensión arterial.", "C": "Confirmar el diagnóstico mediante automedida domiciliaria (AMPA) o monitorización ambulatoria (MAPA), o con nuevas mediciones en visitas separadas si no están disponibles.", "D": "Recomendar dieta hiposódica, ejercicio aeróbico 30 minutos al día, consumo limitado de alcohol, evitar situaciones estresantes y programar cita para estudiar su hipertensión arterial.", "E": "Enviar al servicio de Nefrología para el estudio de su hipertensión arterial."}, "correct": "C", "wrong": "B", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 69, "pg": [73], "temaKey": "Cardiología", "temaLabel": "Cardiología", "meta": "", "stem": "¿Cuál de los siguientes pacientes hipertensos se beneficia más de un mayor descenso de la presión arterial para prevenir complicaciones cardiovasculares?", "opts": {"A": "Anciano con hipertensión sistólica aislada.", "B": "Varón de edad media con antecedentes de infarto de miocardio.", "C": "Diabético con nefropatía diabética.", "D": "Mujer joven con estenosis de arteria renal.", "E": "Mujer de 50 años, fumadora, obesa e hipercolesterolémica."}, "correct": "C", "wrong": "B", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 70, "pg": [74], "temaKey": "Cardiología", "temaLabel": "Cardiología", "meta": "", "stem": "De las situaciones que se describen a continuación, ¿cuál NO precisa medicación parenteral para reducir inmediatamente la presión arterial?", "opts": {"A": "Eclampsia.", "B": "Disección aórtica, con presión arterial de 220/135 mmHg.", "C": "Fracaso renal agudo con oligoanuria en el contexto de crisis hipertensiva.", "D": "Crisis hipertensiva con obnubilación y cefalea severa y fondo de ojo con papiledema, exudados y hemorragias.", "E": "Ictus isquémico agudo con disfasia y hemiparesia, sin progresión en las últimas 8 horas y con presión arterial de 200/120 mmHg."}, "correct": "E", "wrong": "C", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 71, "pg": [75], "temaKey": "Cardiología", "temaLabel": "Cardiología", "meta": "", "stem": "¿Cuál de las siguientes afirmaciones es cierta en relación con la hipertensión sistólica aislada?", "opts": {"A": "Se define como una presión arterial sistólica mayor o igual a 165 mmHg y diastólica menor de 95 mmHo.", "B": "Comporta un riesgo cardiovascular menor que la hipertensión diastólica.", "C": "Es el tipo de hipertensión más frecuente en la edad media de la vida.", "D": "Se asocia frecuentemente a hipotensión ortostática.", "E": "No se beneficia del tratamiento farmacológico."}, "correct": "D", "wrong": "A", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 72, "pg": [76], "temaKey": "Cardiología", "temaLabel": "Cardiología", "meta": "", "stem": "Se diagnostica HTA moderada a una mujer de 49 años, menopáusica desde hace 3 años. Tiene antecedentes de migraña desde los 20 años y asma intrínseco desde los 41. ¿Cuál de los siguientes fármacos NO estaría indicado en el tratamiento de su HTA?", "opts": {"A": "Betabloqueantes.", "B": "Diuréticos.", "C": "Antagonistas del calcio.", "D": "IECA.", "E": "Prazosín."}, "correct": "A", "wrong": "E", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 73, "pg": [77], "temaKey": "Cardiología", "temaLabel": "Cardiología", "meta": "", "stem": "¿Qué exploraciones complementarias se aceptan como suficientes y con mejor relación coste- beneficio, para el estudio de una hipertensión moderada en un paciente adulto?", "opts": {"A": "Hemograma, creatinina, BUN, análisis de orina, ecocardiograma y radiografía de abdomen.", "B": "Hemograma, creatinina, BUN, análisis de orina, iones en sangre, glucosa, lípidos, electrocardiograma y radiografía de tórax.", "C": "Hemograma, creatinina, BUN, análisis de orina, ecocardiograma, electrocardiograma y TC abdominal.", "D": "Hemograma, creatinina, BUN, análisis de orina, iones en sangre, catecolaminas urinarias y cortisol plasmático.", "E": "Hemograma, creatinina, BUN, análisis de orina, glucosa, lípidos, iones en sangre, catecolaminas urinarias, cortisol plasmático, ecocardiograma, radiografía de tórax y TC abdominal."}, "correct": "B", "wrong": "E", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 74, "pg": [78], "temaKey": "Cardiología", "temaLabel": "Cardiología", "meta": "", "stem": "En las mujeres con hipertensión esencial, durante el embarazo debe continuarse el tratamiento antihipertensivo, EXCEPTO con uno de estos fármacos:", "opts": {"A": "Los diuréticos.", "B": "Los betabloqueantes.", "C": "Los calcioantagonistas.", "D": "Los inhibidores de la ECA.", "E": "La alfametildopa."}, "correct": "D", "wrong": "E", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 75, "pg": [79], "temaKey": "Cardiología", "temaLabel": "Cardiología", "meta": "", "stem": "Señale la afirmación correcta, respecto a la hipertensión arterial:", "opts": {"A": "La presión arterial diastólica coincide con la fase IV de los sonidos de Korotkoff.", "B": "La posición del brazo en relación al corazón no afecta a los valores de la presión arterial.", "C": "La hipertensión arterial no es un factor de riesgo de retinopatía.", "D": "La hipertensión arterial es igualmente frecuente en todos los grupos de población, sin diferencias relevantes.", "E": "Con el tratamiento de la hipertensión arterial se ha demostrado un mayor efecto en la prevención del ictus que en la de la cardiopatía isquémica."}, "correct": "E", "wrong": "A", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 76, "pg": [80], "temaKey": "Cardiología", "temaLabel": "Cardiología", "meta": "", "stem": "Respecto a la contracción global y segmentaria del ventrículo izquierdo, señale la respuesta correcta:", "opts": {"A": "Ante un paciente que ingresa por insuficiencia cardiaca y vemos en el estudio ecocardiográfico que presenta una miocardiopatía dilatada con disfunción ventricular y un aneurisma apical (con la pared adelgazada e hiperecogénica), debemos pensar en un infarto agudo de la descendente anterior (DA) y activar código infarto para un cateterismo urgente.", "B": "El diagnóstico de la miocardiopatía por estrés (Tako-Tsubo) es posible a partir del electrocardiograma y la ecocardiografía (discinesia/hipocinesia severa de todos los segmentos apicales del ventrículo izquierdo con contractilidad preservada de los segmentos basales).", "C": "Los trombos intraventriculares los veremos con más frecuencia adheridos a los segmentos del ventrículo izquierdo que mejor contracción presentan.", "D": "En la miocardiopatía arritmogénica no veremos afectada ni en la ecocardiografía ni en la resonancia cardíaca la contractilidad segmentaria del ventrículo izquierdo."}, "correct": "B", "wrong": "D", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 77, "pg": [81], "temaKey": "Cardiología", "temaLabel": "Cardiología", "meta": "", "stem": "Señale la afirmación correcta respecto a la miocardiopatía hipertrófica:", "opts": {"A": "Produce aumento de las presiones telediastólicas del ventrículo izquierdo por disfunción diastólica.", "B": "Enal menos el 95% de los pacientes existe obstrucción del tracto de salida del ventrículo izquierdo en reposo.", "C": "Se hereda con carácter autosómico recesivo y penetrancia completa.", "D": "La mayoría de los pacientes presenta insuficiencia cardíaca avanzada desde el diagnóstico.", "E": "El soplo obstructivo, cuando existe, disminuye con la maniobra de cuclillas y aumenta al elevar las piernas."}, "correct": "A", "wrong": "E", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 78, "pg": [82], "temaKey": "Cardiología", "temaLabel": "Cardiología", "meta": "", "stem": "El electrocardiograma de la miocardiopatía hipertrófica apical se caracteriza por:", "opts": {"A": "Ondas Q en derivaciones anteriores.", "B": "Ondas Q en derivaciones inferiores.", "C": "Ondas T gigantes positivas en derivaciones anteriores.", "D": "Ondas T gigantes negativas en derivaciones anteriores.", "E": "Ondas U diseminadas, amplias y profundas."}, "correct": "D", "wrong": "B", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 79, "pg": [83], "temaKey": "Cardiología", "temaLabel": "Cardiología", "meta": "", "stem": "Varón de 27 años con dolor en el hemiabdomen superior derecho e hinchazón de piernas de 10 días de evolución. Cuatro semanas antes y durante unos días ha presentado odinofagia, mialgias y fiebre y las dos noches previas a la consulta actual ha dormido sentado en la cama. Bebe alcohol ocasionalmente, no fuma y no hay antecedentes familiares de interés. Presión arterial de 110/80 mmHd. Presión venosa elevada, frecuencia cardíaca de 110 lpm con contracciones prematuras aisladas. Estertores crepitantes en tercio inferior de ambos pulmones. Latido de la punta en 7* espacio intercostal izquierdo en línea axilar anterior. Se ausculta tercer tono y soplo holosistólico III/VI en punta irradiado a axila. Hepatomegalia dolorosa y edema con fóvea en miembros inferiores hasta rodillas. ECG: taquicardia sinusal con bloqueo de RI y extrasístoles ventriculares frecuentes. Con más probabilidad, el paciente tendrá:", "opts": {"A": "Infarto de miocardio subagudo no transmural.", "B": "Pericarditis aguda con derrame.", "C": "Tromboembolismo pulmonar agudo.", "D": "Miocardiopatía dilatada.", "E": "Sindrome posinfarto (sindrome de Dressler)."}, "correct": "D", "wrong": "B", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 80, "pg": [84], "temaKey": "Cardiología", "temaLabel": "Cardiología", "meta": "", "stem": "Paciente de 38 años que consulta por disnea y palpitaciones en relación con esfuerzos vigorosos, en la exploración tiene un soplo sistólico rudo que aumenta con la maniobra de Valsalva y en el estudio eco-Doppler presenta un engrosamiento grave de las paredes del ventrículo izquierdo con un gradiente sistólico en el tracto de salida del ventrículo izquierdo de 20 mmHo. ¿Cuál de las siguientes afirmaciones es cierta?", "opts": {"A": "La disnea está en relación con la severidad del gradiente dinámico en el tracto de salida del ventrículo izquierdo.", "B": "La disnea está en relación con la mayor rigidez de la pared de ventrículo izquierdo.", "C": "La disnea está en relación con disfunción sistólica del ventrículo izquierdo.", "D": "La disnea está en relación con la regurgitación valvular mitral.", "E": "La disnea es un síntoma muy infrecuente en estos pacientes."}, "correct": "B", "wrong": "A", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 81, "pg": [85], "temaKey": "Cardiología", "temaLabel": "Cardiología", "meta": "", "stem": "Todos los siguientes factores aumentan el gradiente de la obstrucción en la miocardiopatía obstructiva, EXCEPTO:", "opts": {"A": "La digoxina.", "B": "El isoproterenol.", "C": "La maniobra de Valsalva.", "D": "La nitroglicerina.", "E": "La fenilefrina."}, "correct": "E", "wrong": "A", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 82, "pg": [86], "temaKey": "Cardiología", "temaLabel": "Cardiología", "meta": "", "stem": "Uno de los siguientes datos exploratorios EXCLUYE el diagnóstico de miocardiopatía dilatada:", "opts": {"A": "Soplo pansistólico mitral.", "B": "Soplo de llenado mitral.", "C": "Refuerzo del componente pulmonar del segundo tono.", "D": "Pulso alternante.", "E": "Tercertono."}, "correct": "B", "wrong": "D", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 83, "pg": [87], "temaKey": "Cardiología", "temaLabel": "Cardiología", "meta": "", "stem": "¿Cuál de los siguientes hallazgos NO se encuentra en la miocardiopatía dilatada idiopática?", "opts": {"A": "Cardiomegalia.", "B": "Estenosis en las coronarias de diferente severidad.", "C": "Aumento de la presión telediastólica del ventrículo izquierdo.", "D": "Disminución de la fracción de eyección.", "E": "Anormalidades de la contractilidad segmentaria."}, "correct": "B", "wrong": "E", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 84, "pg": [88], "temaKey": "Nefrología", "temaLabel": "Nefrología", "meta": "MIR 2023 · P26 · 53.5% acierto", "stem": "En un paciente con síndrome nefrótico es posible encontrar una de las siguientes alteraciones plasmáticas en el perfil lipoproteico:", "opts": {"A": "Disminución de las lipoproteínas de muy baja densidad (VLDL).", "B": "Aumento de la apolipoproteína B-100.", "C": "Aumento de la apolipoproteína A-I.", "D": "Aumento de la actividad lipoproteínlipasa (LPL)."}, "correct": "B", "wrong": "A", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 85, "pg": [89], "temaKey": "Nefrología", "temaLabel": "Nefrología", "meta": "MIR 2024 · P143", "stem": "Hombre de 28 años con diagnóstico reciente de linfoma de Hodgkin, que consulta por debilidad y edematización progresivas. La exploración es normal salvo por la presencia de edema con fóvea hasta las rodillas. Análisis: urea 58 mg/dL, creatinina 0,78 mg/dL, sodio 138 mEq/L, potasio 4,3 mEq/L, albúmina 2 g/dL. Sistemático de orina: proteinuria 4+ (> 600 mg/dL) sin hematuria ni leucocituria. ¿Cuál de las siguientes enfermedades es más probable que tenga?", "opts": {"A": "Glomerulonefritis de cambios mínimos.", "B": "Glomerulonefritis membranosa.", "C": "Glomerulonefritis membranoproliferativa.", "D": "Glomeruloesclerosis focal y segmentaria."}, "correct": "A", "wrong": "B", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 86, "pg": [90], "temaKey": "Nefrología", "temaLabel": "Nefrología", "meta": "MIR 2010 · P96", "stem": "Un paciente de 45 años de edad, con una hipertensión esencial moderada-leve, sin repercusión sobre órganos diana y función renal normal, inicia tratamiento con captopril. Unos meses después comienza a presentar edemas maleolares y orinas espumosas. La analítica en sangre y orina muestra una creatinina normal, hipoproteinemia y proteinuria de más de 3 g/día. No hay cambios en las cifras de complemento. Se realiza una biopsia renal y se retira el captopril. Unos meses después, la situación clínica se ha normalizado. ¿Qué mostró la biopsia?", "opts": {"A": "Una estenosis de la arteria renal.", "B": "Una glomerulonefritis aguda.", "C": "Una glomerulonefritis membranosa.", "D": "Un riñón ópticamente normal.", "E": "Una glomerulonefritis membranoproliferativa."}, "correct": "C", "wrong": "A", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 87, "pg": [91], "temaKey": "Nefrología", "temaLabel": "Nefrología", "meta": "MIR 2018 · P234 · 75.6% acierto", "stem": "¿Cuál de las siguientes glomerulopatías es la causa más frecuente de síndrome nefrótico en el anciano?", "opts": {"A": "Glomerulonefritis membranosa.", "B": "Glomeruloesclerosis segmentaria focal.", "C": "Nefropatía diabética.", "D": "Amiloidosis renal."}, "correct": "A", "wrong": "B", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 88, "pg": [92], "temaKey": "Nefrología", "temaLabel": "Nefrología", "meta": "MIR 2002 · P100 · 85.9% acierto", "stem": "En un paciente con síndrome nefrótico, las medidas generales NO específicas para corregir la proteinuria incluyen uno de los siguientes procedimientos:", "opts": {"A": "Dieta hiperproteica.", "B": "Diuréticos y/o betabloqueantes.", "C": "Inhibidores de la enzima conversora de la angiotensina (IECA).", "D": "Calcioantagonistas no dihidropiridínicos.", "E": "Corticoides por vía sistémica."}, "correct": "C", "wrong": "A", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 89, "pg": [93], "temaKey": "Nefrología", "temaLabel": "Nefrología", "meta": "MIR 2006 · P190 · 70.3% acierto", "stem": "Todo lo que sigue acerca del síndrome nefrótico en el niño es cierto, EXCEPTO:", "opts": {"A": "Colesterol sérico elevado.", "B": "El85% se debe a la forma histológica de enfermedad de cambios mínimos.", "C": "Reabsorción reducida de sodio por el riñón.", "D": "Triglicéridos séricos elevados.", "E": "La hipoalbuminemia es la causa de la hipoproteinemia."}, "correct": "C", "wrong": "D", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 90, "pg": [94], "temaKey": "Nefrología", "temaLabel": "Nefrología", "meta": "", "stem": "Todas estas medidas terapéuticas son aconsejables en el manejo del sindrome nefrótico, EXCEPTO:", "opts": {"A": "El uso de estatinas para el control de la hipercolesterolemia secundaria.", "B": "Una dieta restrictiva e hipoproteica (menor a 0,6 g/kg/día) de forma generalizada para reducir la proteinuria.", "C": "La anticoagulación formal y prolongada si se confirma un evento trombótico, como la trombosis de la vena renal.", "D": "Los diuréticos de asa, asociados o no a tiazidas, como primera línea para el tratamiento de los edemas.", "E": "La infusión de albúmina intravenosa combinada con diuréticos en casos seleccionados de anasarca refractaria."}, "correct": "B", "wrong": "D", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 91, "pg": [95], "temaKey": "Nefrología", "temaLabel": "Nefrología", "meta": "MIR 2001 (F) · P140 · 52.3% acierto", "stem": "La enfermedad renal denominada glomerulonefritis membranosa (GNM) cursa habitualmente con un síndrome nefrótico (SN) de larga evolución. Se han descrito diferentes causas etiológicas inductoras de GNM y se acepta que de poder controlar la causa o eliminar el agente, la enfermedad renal podría remitir. De las abajo enumeradas, todas EXCEPTO una, pueden ser inductoras de glomerulonefritis membranosa, señálela:", "opts": {"A": "Virus de la hepatitis B (VHB).", "B": "Tumores sólidos de colon.", "C": "Dermatitis herpetiforme.", "D": "Picaduras por determinados insectos (abejas, avispas).", "E": "Administración prolongada de penicilamina."}, "correct": "D", "wrong": "C", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 92, "pg": [96], "temaKey": "Nefrología", "temaLabel": "Nefrología", "meta": "", "stem": "Un paciente con síndrome nefrótico presenta súbitamente dolor lumbar, varicocele izquierdo, hematuria, incremento significativo de la proteinuria y rápido deterioro de la función renal. Usted debe pensar que dicho paciente probablemente ha desarrollado:", "opts": {"A": "Un síndrome urémico-hemolítico.", "B": "Una trombosis de la vena renal.", "C": "Una glomerulonefritis rápidamente progresiva.", "D": "Una coagulación intravascular diseminada.", "E": "Una obstrucción de vías urinarias."}, "correct": "B", "wrong": "C", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 93, "pg": [97], "temaKey": "Digestivo", "temaLabel": "Digestivo", "meta": "", "stem": "Un hombre de 52 años sin enfermedades concomitantes, acude a urgencias por melenas de 24 horas de evolución sin repercusión hemodinámica. Niega consumo de antiinflamatorios no esteroideos. El hematocrito es de 33% y el resto de la analítica es normal. La endoscopia digestiva alta realizada de forma urgente a las 6 horas del ingreso muestra un estómago normal, sin sangre ni restos hemáticos y una úlcera excavada de 8 mm de diámetro en cara anterior del bulbo duodenal con \"vaso visible\" en su base y sin sangrado activo. ¿Cuál de las siguientes afirmaciones es cierta?", "opts": {"A": "En la endoscopia inicial está indicado aplicar una terapéutica endoscópica y posteriormente instaurar tratamiento endovenoso con dosis altas de un inhibidor de la bomba de protones. Esta estrategia ha demostrado reducir el riesgo de recidiva hemorrágica y la mortalidad.", "B": "En la endoscopia inicial, dada la ausencia de sangrado activo, no está indicado aplicar una terapéutica endoscópica. Posteriormente, para reducir el riesgo de recidiva hemorrágica, se deberá instaurar tratamiento endovenoso con dosis altas de un inhibidor de la bomba de protones.", "C": "En la endoscopia inicial está indicado aplicar una terapéutica endoscópica. No se ha podido demostrar que instaurar posteriormente tratamiento endovenoso con dosis altas de un inhibidor de la bomba de protones aporte beneficio adicional alguno.", "D": "Dado que se trata de una úlcera complicada (hemorragia), una vez resuelto el episodio hemorrágico está indicada una vagotomía con piloroplastia."}, "correct": "A", "wrong": null, "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 94, "pg": [98], "temaKey": "Digestivo", "temaLabel": "Digestivo", "meta": "", "stem": "Hombre de 65 años con antecedentes personales de hepatopatía crónica etílica en estadio funcional A de Child en tratamiento con ibuprofeno por lumbalgia, presenta cuadro de hematemesis de sangre roja. A su llegada a urgencias presenta presión arterial de 120/60 mmHg. En la analítica muestra como datos más destacados hemoglobina 10 g/dL, plaquetas 250.000/ UL, urea 85 mg/dL y creatinina 1,1 mg/dL. Se realiza endoscopia urgente que muestra la imagen adjunta. Ante dichos hallazgos, ¿cuál JaKi3P6LRuf0WgCWiotz+i0bn9FoAloqLc/otG5/RaAJaKi3P6LRuf0WgCWiotz+i0bn9FoAkoqPc/ov60bn9FoAe7bVJpijCgelIBk5Y5NOFMQlFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQBHvk/54n/voUb5P+eJ/wC+hUlFAEe+T/nif++hRvk/54n/AL6FSUUAR75P+eJ/76FG+T/nif8AvoVJRQBHvk/54n/voUb5P+eJ/wC+hUlFAEe+T/nif++hR5rj70RA9QQakooAAQwBByDSO4QZP5etR23+r/E0Sf66L8aYC+ZJ/wA8T/30KN8n/PE/99CpKKQEe+T/AJ4n/voUb5P+eJ/76FSUUAR75P8Anif++hRvk/54n/voVJRQBHvk/wCeJ/76FG+T/nif++hUlFAEe+T/AJ4n/voUb5P+eJ/76FSUUAR75P8Anif++hRvk/54n/voVJRQAxZMttZSrdge9PqKfrH/AL1TUAJRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFBooAKKKKACiiigAooooAKKKKACiiigAooooGFFFFABRRRQFgooooEFFFFAz//2Q==", "expl": "", "truncated": false, "prevOk": false}, {"id": 95, "pg": [99], "temaKey": "Digestivo", "temaLabel": "Digestivo", "meta": "", "stem": "Una mujer de 55 años, postmenopáusica, consulta por astenia y disnea de esfuerzo. En la anamnesis refería ligera epigastralgia y pirosis ocasional. No metrorragias. En la analítica: Hb 6 g/dL, VCM 69 fL, sideremia 13 ug/aL, ferritina 4 ng/mL. Endoscopia digestiva alta: pequeña hernia hiatal por deslizamiento sin signos de esofagitis. ¿Cuál es la actitud más correcta con esta enferma?", "opts": {"A": "Administrar hierro oral y ver evolución de la anemia.", "B": "Tratar con inhibidores de la bomba de protones y evaluar a los tres meses.", "C": "Recomendar una colonoscopia completa.", "D": "Realizar un estudio con cápsula endoscópica.", "E": "Solicitar una evaluación ginecológica."}, "correct": "C", "wrong": "D", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 96, "pg": [100], "temaKey": "Digestivo", "temaLabel": "Digestivo", "meta": "", "stem": "Una mujer de 81 años acude por astenia franca durante el último mes. La analítica revela una anemia microcítica y ferropénica (hemoglobina 10 g/dL, hematocrito 29%, VCM 71fL, sideremia 15 ug/dL). Es hipertensa, por lo cual recibe un inhibidor de la enzima convertidora de la angiotensina, y padece dolores osteomusculares generalizados atribuidos a artrosis que trata de forma espontánea con ácido acetilsalicílico. No refiere molestias digestivas, su hábito deposicional es normal y nunca ha visto sangre en las deposiciones. Una prueba de sangre oculta en heces da resultado positivo. Usted indica una endoscopia digestiva alta y una colonoscopia total, que no muestran lesión alguna. ¿Cuál sería la conducta más adecuada?", "opts": {"A": "Indicar una exploración del intestino delgado con cápsula endoscópica.", "B": "Indicar una arteriografía selectiva de tronco celíaco y ambas mesentéricas para descartar angiodisplasia.", "C": "Indicar una gammagrafía con pertecnetato de Tc-99m para descartar divertículo de Meckel.", "D": "Limitarse a dar tratamiento con hierro oral.", "E": "Prohibir el uso de ácido acetilsalicílico U otros AINE, dar hierro oral y repetir la analítica en un plazo de 2 meses."}, "correct": "E", "wrong": "A", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 97, "pg": [101], "temaKey": "Digestivo", "temaLabel": "Digestivo", "meta": "", "stem": "Paciente de 72 años, que como único tratamiento toma antidiabéticos orales, presenta anemia ferropénica crónica, con hemorragias ocultas positivas. ¿Cuál es el método diagnóstico más indicado para localizar la lesión sangrante?", "opts": {"A": "Tránsito gastroduodenal.", "B": "Gammagrafía con hematíes marcados.", "C": "Tránsito intestinal.", "D": "Colonoscopia total.", "E": "Panendoscopia oral."}, "correct": "D", "wrong": "E", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 98, "pg": [102], "temaKey": "Digestivo", "temaLabel": "Digestivo", "meta": "", "stem": "¿Cuál de las siguientes pruebas es más adecuada para diagnosticar la causa de un cuadro de melenas de repetición sin otra sintomatología?", "opts": {"A": "Colonoscopia total.", "B": "Estudio radiológico con doble contraste de esófago, estómago y duodeno.", "C": "Enema opaco.", "D": "Arteriografía mesentérica.", "E": "Panendoscopia oral."}, "correct": "E", "wrong": "A", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 99, "pg": [103], "temaKey": "Digestivo", "temaLabel": "Digestivo", "meta": "", "stem": "Señale, entre las siguientes, la afirmación INCORRECTA referente al tratamiento farmacológico del sangrado agudo por varices esofágicas:", "opts": {"A": "La somatostatina y el octreótido son más efectivos que el placebo para controlar la hemorragia.", "B": "La somatostatina y el octreótido tienen menos efectos colaterales que la vasopresina.", "C": "No hay constancia clara de que la somatostatina o el octreótido aumenten la supervivencia.", "D": "Hay constancia de que la vasopresina aumenta la supervivencia a pesar de los efectos colaterales.", "E": "La somatostatina y el octreótido parecen de elección en el tratamiento inicial de la hemorragia."}, "correct": "D", "wrong": "C", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 100, "pg": [104], "temaKey": "Digestivo", "temaLabel": "Digestivo", "meta": "", "stem": "Un paciente de 70 años presenta una rectorragia de 2.500 mL en dos horas. La endoscopia digestiva alta descarta lesiones de esófago, estómago o duodeno. El método diagnóstico más rentable será:", "opts": {"A": "Rectoscopia.", "B": "Colonoscopia.", "C": "Gammagrafía con hematíes marcados.", "D": "Angio-TC urgente seguida de arteriografía selectiva de mesentérica superior e inferior, con intención diagnóstica y terapéutica.", "E": "Laparotomía."}, "correct": "D", "wrong": "B", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 101, "pg": [105], "temaKey": "Digestivo", "temaLabel": "Digestivo", "meta": "", "stem": "¿Cuál de las siguientes situaciones clínicas se asocia con más frecuencia al divertículo de Meckel?", "opts": {"A": "Obstrucción intestinal.", "B": "Diverticulitis aguda.", "C": "Hemorragias digestivas en forma de melena o rectorragias.", "D": "Malabsorción intestinal.", "E": "Aparición de un cáncer en tejido ectópico."}, "correct": "C", "wrong": "B", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 102, "pg": [106], "temaKey": "Digestivo", "temaLabel": "Digestivo", "meta": "MIR 2015 · P42", "stem": "Un varón de 25 años acude por ictericia. Es culturista y refiere uso reciente de esteroides anabolizantes, incluidos preparados 17-alfa-alquilados, tres semanas antes. Quince días antes había suspendido un tratamiento con amoxicilina-clavulánico indicado por una amigdalitis. La analítica muestra AST 1.200 UI/L (limite superior de la normalidad [LSN]: 40), ALT 1.300 UI/L (LSN: 40), GGT 150 UI/L (LSN: 50), fosfatasa alcalina 180 UI/L (LSN: 105) y bilirrubina total 4,8 mg/dL, con predominio directo. La serología del virus de la hepatitis B revela anti-HBs y anti-HBc positivos. La ecografía abdominal muestra esteatosis hepática leve. ¿Cuál de los siguientes diagnósticos es el más probable?", "opts": {"A": "Hepatitis por amoxicilina-clavulánico.", "B": "Hepatitis por esteroides anabólicos.", "C": "Hepatitis aguda por virus de la hepatitis B (VHB).", "D": "Esteatohepatitis no alcohólica.", "E": "Colestasis por fármacos."}, "correct": "A", "wrong": "B", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 103, "pg": [107], "temaKey": "Digestivo", "temaLabel": "Digestivo", "meta": "", "stem": "En relación con la infección por el virus de la hepatitis C (VHC) y su manejo clínico, ¿cuál de las siguientes afirmaciones es FALSA?", "opts": {"A": "Es un virus con genoma ARN monocatenario perteneciente a la familia Flaviviridae.", "B": "El genotipo 1, especialmente el subtipo Tb, es el más prevalente en España.", "C": "La infección crónica por este virus puede causar cirrosis hepática y hepatocarcinoma.", "D": "El tratamiento estándar alcanza tasas de curación superiores al 95 %.", "E": "La ribavirina en monoterapia es superior a los antivirales de acción directa como el sofosbuvir."}, "correct": "E", "wrong": null, "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 104, "pg": [108], "temaKey": "Digestivo", "temaLabel": "Digestivo", "meta": "MIR 2006 · P9 · 57.3% acierto", "stem": "Mujer de 32 años con antecedentes personales de consumo de drogas vía parenteral hasta hace 4 años, que en una analítica de control se objetiva serología positiva para el virus de la hepatitis C (VHC). Serologías para el virus de la hepatitis B (VHB) y para el VIH negativas. Pareja estable en la actualidad. ¿Cuál de las siguientes medidas NO aconsejaríamos a esta paciente?", "opts": {"A": "Vacunación de la hepatitis A.", "B": "La lactancia materna.", "C": "No compartir objetos de aseo personal.", "D": "Utilizar siempre métodos de barrera en las relaciones sexuales con su pareja.", "E": "No donación de sangre."}, "correct": "D", "wrong": "B", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 105, "pg": [109], "temaKey": "Digestivo", "temaLabel": "Digestivo", "meta": "MIR 2008 · P10 · 41.4% acierto", "stem": "¿Cuál de las siguientes afirmaciones relativas al tratamiento actual de las hepatitis virales crónicas es FALSA?", "opts": {"A": "Una respuesta virológica sostenida tras tratar la hepatitis C se considera curación virológica de la infección.", "B": "La negativización mantenida del ADN del virus de la hepatitis B se considera curación completa de la infección.", "C": "La hepatitis C crónica se trata con combinaciones orales de antivirales de acción directa.", "D": "La elección del tratamiento de la hepatitis C depende de factores como cirrosis, tratamientos previos, interacciones y genotipo cuando corresponda.", "E": "En la hepatitis B crónica, tenofovir y entecavir son antivirales de referencia por potencia y barrera genética."}, "correct": "B", "wrong": "A", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 106, "pg": [110], "temaKey": "Digestivo", "temaLabel": "Digestivo", "meta": "MIR 2010 · P33 · 50.1% acierto", "stem": "Hombre de 28 años, informático, habitualmente sano, deportista de gimnasio (halterofilia), sin antecedentes patológicos recientes, consulta por malestar general, ictericia, coluria y prurito discreto. En la analítica destaca: bilirrubina directa 96 ¡umol/L (5,6 mg/dL), total 100 mol/L (5,8 mg/dL), ALT 80 U/L (N < 40), AST 75 U/L (N < 40), fosfatasa alcalina 180 U/L (N < 120) y gamma GT 79 U/L (N < 45). ¿Cuál es el diagnóstico más probable entre los siguientes?", "opts": {"A": "Enfermedad de Gilbert.", "B": "Hepatitis viral aguda.", "C": "Toxicidad por paracetamol.", "D": "Toxicidad por anabolizantes por vía oral.", "E": "Toxicidad por amoxicilina-clavulánico."}, "correct": "D", "wrong": "B", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 107, "pg": [111], "temaKey": "Digestivo", "temaLabel": "Digestivo", "meta": "MIR 2000 · P3 · 84.6% acierto", "stem": "Paciente de 29 años con datos histológicos de hepatitis crónica en la biopsia hepática y los datos analíticos siguientes: GOT y GPT dos veces por encima del límite alto de la normalidad, bilirrubina 0,2 mg/dL; serología para virus de la hepatitis B: HBsAg(-), HBsAc(+), HBcAc(+). Anticuerpos anti-VHC(+); ceruloplasmina y Cu+ sérico normales. ¿Cuál es, entre las siguientes, la causa más probable de la hepatitis crónica?", "opts": {"A": "Infección por el virus de la hepatitis C.", "B": "Infección por el virus de la hepatitis B.", "C": "Enfermedad de Wilson.", "D": "Hemocromatosis.", "E": "Déficit de alfa 1 antitripsina."}, "correct": "A", "wrong": "B", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 108, "pg": [112], "temaKey": "Digestivo", "temaLabel": "Digestivo", "meta": "MIR 2000 (F) · P1 · 59.2% acierto", "stem": "Señale cuál de las manifestaciones siguientes NO se relaciona con la positividad del HBsAg:", "opts": {"A": "Urticaria.", "B": "Poliarteritis nodosa.", "C": "Crioglobulinemia.", "D": "Colangitis biliar primaria.", "E": "Hepatocarcinoma."}, "correct": "D", "wrong": "E", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 109, "pg": [113], "temaKey": "Digestivo", "temaLabel": "Digestivo", "meta": "MIR 2002 · P11 · 34.6% acierto", "stem": "Una joven de 19 años refiere que ha tenido episodios de ictericia, fiebre, malestar general, artralgias y elevación importante de transaminasas a lo largo de los últimos seis meses. No tomaba ningún fármaco. Se encontró hipergammaglobulinemia. Los marcadores de la hepatitis A, B y C son negativos, al igual que los anticuerpos antinucleares. En la biopsia hepática se encuentran necrosis \"en puentes\". ¿Cuál de las siguientes pruebas será la mejor para establecer el diagnóstico?", "opts": {"A": "Determinación de factor reumatoide.", "B": "Anticuerpos antimitocondriales.", "C": "Anticuerpos frente a antígenos microsomales de hígado y riñón.", "D": "Anticuerpos frente al virus de la hepatitis D.", "E": "Anticuerpos frente al virus de la hepatitis E."}, "correct": "C", "wrong": "B", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 110, "pg": [114], "temaKey": "Digestivo", "temaLabel": "Digestivo", "meta": "MIR 2005 · P12 · 47.1% acierto", "stem": "Enferma de 72 años que consulta porque desde hace al menos 5 años tiene las transaminasas ligeramente elevadas (nunca por encima de 100 Ul/L). Es ligeramente obesa (índice de masa corporal = 28) y no se encuentra mal. No bebe alcohol, no toma medicamentos de forma habitual, los marcadores de virus de hepatitis B y C son negativos y la analítica habitual es normal salvo AST (GOT) 82 UI/L y ALT (GPT) 107 UI/L, con gammaglobulina de 1,8 g/dL e IgG de 1.700 mg/dL. Tiene anticuerpos antinucleares positivos a 1/80 y anticuerpos antimúsculo liso a 1/160. ¿Cuál sería el siguiente paso?", "opts": {"A": "Recomendar que normalice su peso, porque con ello es probable que lo hagan las alteraciones analíticas.", "B": "Indicar la práctica de una biopsia hepática.", "C": "Iniciar tratamiento con prednisona y azatioprina.", "D": "Iniciar tratamiento con ácido ursodesoxicólico.", "E": "Tranquilizar a la enferma por lo irrelevante de su proceso."}, "correct": "B", "wrong": "C", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 111, "pg": [115], "temaKey": "Digestivo", "temaLabel": "Digestivo", "meta": "MIR 1997 · P186 · 66% acierto", "stem": "¿Qué afirmación, entre las siguientes, relativa a los datos de laboratorio de la hepatitis por virus de la hepatitis A (VHA), es correcta?", "opts": {"A": "La IgG anti-VHA permanece elevada de manera permanente tras la infección, independientemente de que haya Xx habido clínica o no.", "B": "Las transaminasas se elevan, por lo general, cuando han transcurrido dos meses de la infección y si permanecen elevadas a los seis meses, indican evolución a la cronicidad.", "C": "La elevación de la IgG anti-VHA es el dato de laboratorio más precoz de que disponemos para detectar la infección.", "D": "La aparición de VHA en heces es un hecho relativamente tardío (después de 10 semanas) y muy inconstante.", "E": "La elevación de la IgM anti-VHA es de poca utilidad diagnóstica por su inconstancia y la variabilidad de su aparición."}, "correct": "A", "wrong": "E", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 112, "pg": [116], "temaKey": "Digestivo", "temaLabel": "Digestivo", "meta": "MIR 1997 (F) · P18 · 37.2% acierto", "stem": "En una persona con clínica de hepatitis aguda que presenta los siguientes marcadores: HBsAg+, IgM anti-VHA+ e IgM anti-HBc+, el diagnóstico etiológico que estableceríamos sería de:", "opts": {"A": "Hepatitis por virus de la hepatitis B (VHB).", "B": "Hepatitis por virus de la hepatitis A (VHA).", "C": "Hepatitis aguda por VHA y VHB.", "D": "Hepatitis aguda por VHB en el seno de una crónica por VHA.", "E": "Hepatitis aguda por VHA en el seno de una crónica por VHB."}, "correct": "C", "wrong": "E", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 113, "pg": [117], "temaKey": "Digestivo", "temaLabel": "Digestivo", "meta": "MIR 1998 · P205 · 58.4% acierto", "stem": "Un varón de 32 años, asintomático, es detectado como HBsAg positivo durante un cribado para donación de sangre. En dos determinaciones separadas por 6 meses presenta ALT/AST, bilirrubina, fosfatasa alcalina y tiempo de protrombina normales. La serología muestra HBsAg positivo, anti-HBs negativo, HBeAg negativo, anti-HBe positivo, anti-HBc total positivo e IgM anti-HBc negativa. El ADN-VHB es de 450 Ul/mL. ¿Cuál es la conducta más adecuada en este momento?", "opts": {"A": "Solicitar biopsia hepática urgente para evaluar el nivel de inflamación, el daño celular y el grado de fibrosis.", "B": "Iniciar tratamiento antiviral con tenofovir o entecavir para curar su hepatitis crónica.", "C": "Estudiar la serología frente al VHB de su pareja sexual y vacunarla si es susceptible.", "D": "Iniciar cribado semestral de hepatocarcinoma con ecografía y alfa-fetoproteína.", "E": "Administrar una dosis de la vacuna frente al VHB al paciente para favorecer el aclaramiento viral."}, "correct": "C", "wrong": "D", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 114, "pg": [118], "temaKey": "Digestivo", "temaLabel": "Digestivo", "meta": "MIR 1999 (F) · P4 · 69.1% acierto", "stem": "A un varón de 45 años asintomático se le encuentran, en un examen de empresa, elevaciones de ambas transaminasas tres veces por encima de lo normal. Refiere que, hace 25 años y hasta hace 20, usó heroína parenteral, pero no ha vuelto a emplearla. La exploración clínica es normal. Pensando en una hepatitis B crónica, solicitamos marcadores y encontramos: anti-HBc positivo, anti-HBs positivo, HBsAg negativo, anti-HBe positivo y HBeAg negativo. ¿Qué haría usted a continuación y por qué?", "opts": {"A": "Proponer tratamiento con alfa-interferón, puesto que el paciente es portador de una hepatitis B crónica y reúne criterios para dicho tratamiento.", "B": "Solicitar anti-VIH porque es un drogadicto antiguo y los cambios hepáticos probablemente sean por infección por VIH.", "C": "Solicitar antiVHC, pues el paciente está inmunizado contra el VHB y los cambios hepáticos probablemente sean Xx por VHC.", "D": "No preocuparse más, pues lo más probable es que los datos obtenidos sean falsos positivos del laboratorio.", "E": "Proponer una biopsia hepática, pues no es correcto iniciar el tratamiento con alfa-interferón sin hacer dicha prueba."}, "correct": "C", "wrong": "A", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 115, "pg": [119], "temaKey": "Digestivo", "temaLabel": "Digestivo", "meta": "MIR 2000 · P15 · 36.3% acierto", "stem": "Señale cuál de las siguientes respuestas es correcta en relación con el virus de la hepatitis B (VHB):", "opts": {"A": "La positividad de los anticuerpos anti-HBs indica inmunización frente al VHB.", "B": "La presencia del HBsAg es diagnóstica de hepatitis aguda B.", "C": "La presencia simultánea de anticuerpos anti-HBc de tipo IgM y de HBsAg es diagnóstica de portador sano del VHB.", "D": "La aparición de anticuerpos anti-HBe indica elevada infectividad.", "E": "Los sujetos con anti-HBc positivo deben vacunarse frente al VHB."}, "correct": "A", "wrong": "D", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 116, "pg": [120], "temaKey": "Digestivo", "temaLabel": "Digestivo", "meta": "MIR 1993 · P141 · 73.5% acierto", "stem": "En relación con la hepatitis C, señale el enunciado FALSO:", "opts": {"A": "Fue históricamente la causa más frecuente de hepatitis postransfusional, antes del cribado sistemático de donaciones.", "B": "El período de incubación se sitúa entre 5 y 10 semanas.", "C": "La incidencia de hepatitis crónica es elevada.", "D": "La presencia de anticuerpos anti-VHC define la protección ante la enfermedad.", "E": "Hay portadores asintomáticos del virus de la hepatitis C (VHC)."}, "correct": "D", "wrong": "B", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 117, "pg": [121], "temaKey": "Digestivo", "temaLabel": "Digestivo", "meta": "MIR 1995 · P11 · 60.7% acierto", "stem": "Señale cuál de los siguientes fármacos NO ha sido involucrado como causa de hepatopatía crónica:", "opts": {"A": "Fenobarbital.", "B": "Metotrexato.", "C": "Isoniazida.", "D": "Metildopa.", "E": "Nitrofurantoína."}, "correct": "A", "wrong": "D", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 118, "pg": [122], "temaKey": "Digestivo", "temaLabel": "Digestivo", "meta": "MIR 1991 · P3 · 49.5% acierto", "stem": "En la infección simultánea (coinfección) aguda del virus de la hepatitis delta con el virus de la hepatitis B, uno de los siguientes enunciados es FALSO:", "opts": {"A": "La mortalidad es igual a la que se produce en la hepatitis aguda B aislada.", "B": "Después de que desaparece el HBsAg, no se detecta el anticuerpo anti-delta (anti-VHD) tipo IgG.", "C": "La infección por virus delta aumenta las posibilidades de cronicidad de la hepatitis aguda B.", "D": "Los hallazgos serológicos son: HBsAg (+), anti-HBc (+) tipo IgM, anticuerpos anti-delta (+).", "E": "La pérdida del anticuerpo anti-delta (anti-VHD) tipo IgM confirma la resolución de la infección delta."}, "correct": "C", "wrong": "A", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 119, "pg": [123], "temaKey": "Digestivo", "temaLabel": "Digestivo", "meta": "", "stem": "Enfermo de 48 años diagnosticado de cirrosis hepática alcohólica al que venimos controlando desde hace años. No ha conseguido dejar de beber alcohol. Desde hace 2 años presenta ascitis, que responde cada vez peor al tratamiento diurético. En el momento actual toma 120 mg/día de furosemida, 300 mg/día de espironolactona y tiene ascitis a tensión. Analíticamente destaca Na 121 mEq/L, K 4,7 mEq/L y creatinina 1,6 mg/dL. ¿Cuál es la actitud terapéutica más correcta en el momento actual?", "opts": {"A": "Proponer entrada preferente en un programa de trasplante hepático.", "B": "Establecer un régimen de paracentesis evacuadoras periódicas con reposición coloidal.", "C": "Insertar un TIPS.", "D": "Aumentar aún más las dosis de diuréticos.", "E": "Administrar una sobrecarga de suero salino hipertónico para forzar la diuresis."}, "correct": "B", "wrong": "C", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 120, "pg": [124], "temaKey": "Digestivo", "temaLabel": "Digestivo", "meta": "", "stem": "En un paciente con cirrosis hepática ¿cuál de los siguientes es el procedimiento más útil para medir la respuesta de la ascitis al tratamiento diurético?", "opts": {"A": "Medir el volumen de orina de 24 horas.", "B": "Medir el perímetro abdominal diariamente.", "C": "Determinar cada semana el gradiente de albúmina entre el suero y la ascitis.", "D": "Registrar el peso cada día.", "E": "Evaluar la natriuresis cada 48 horas."}, "correct": "D", "wrong": "E", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 121, "pg": [125], "temaKey": "Digestivo", "temaLabel": "Digestivo", "meta": "", "stem": "Paciente cirrótico de larga evolución que acude a Urgencias por aumento del perímetro abdominal y dolor abdominal difuso. La paracentesis diagnóstica da salida a un líquido con 600 células/uL con 80 % de polimorfonucleares y proteínas 0,795 g/dL. ¿Cuál de estas medidas es la más adecuada en esta situación?", "opts": {"A": "Realizar una paracentesis evacuadora total con reposición de albúmina.", "B": "Iniciar tratamiento con isoniazida, rifampicina, pirazinamida y etambutol a las dosis habituales.", "C": "Enviar una muestra de líquido ascítico al laboratorio de microbiología y no iniciar tratamiento hasta conocer el resultado.", "D": "Incrementar significativamente la dosis de diuréticos que tomaba el paciente.", "E": "Iniciar de inmediato tratamiento con cefotaxima a dosis de 2 g i.v. cada 6 u 8 horas."}, "correct": "E", "wrong": "A", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 122, "pg": [126], "temaKey": "Digestivo", "temaLabel": "Digestivo", "meta": "", "stem": "En el diagnóstico diferencial de la peritonitis bacteriana espontánea del cirrótico con respecto a la peritonitis secundaria, ¿cuál de los siguientes datos puede hacer sospechar una peritonitis secundaria?", "opts": {"A": "Presencia de dolor abdominal a la palpación.", "B": "Presencia de >250 neutrófilos/µL de líquido ascítico.", "C": "Flora monomicrobiana en la tinción de Gram.", "D": "Nivel de glucosa en líquido ascítico menor que en plasma.", "E": "Baja concentración de proteínas en líquido ascítico."}, "correct": "D", "wrong": "E", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 123, "pg": [127], "temaKey": "Digestivo", "temaLabel": "Digestivo", "meta": "", "stem": "Señale cuál de los siguientes factores NO juega un papel en la hipoglucemia que puede aparecer en la insuficiencia hepatocelular:", "opts": {"A": "Resistencia hepática a la insulina.", "B": "Disminución de la neoglucogénesis.", "C": "Disminución del contenido hepático de glucógeno.", "D": "Ingesta oral deficiente.", "E": "Hiperinsulinemia secundaria a cortocircuito portosistémico."}, "correct": "A", "wrong": "E", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 124, "pg": [128], "temaKey": "Digestivo", "temaLabel": "Digestivo", "meta": "", "stem": "Desde el punto de vista clásico, señale lo correcto en relación con la cirrosis hepática en Europa Y EE.", "opts": {"A": "El factor etiológico más frecuente es el consumo alcohólico seguido de la infección viral.", "B": "El factor etiológico más frecuente es la infección viral seguido del consumo alcohólico.", "C": "En la mayoría de los pacientes con cirrosis, la etiología no queda establecida.", "D": "La cirrosis es una enfermedad hepática crónica terminal caracterizada por alteración de la arquitectura hepática, nódulos degenerativos y sin signos de actividad inflamatoria.", "E": "La presencia de displasia hepatocitaria en los nódulos degenerativos cirróticos no supone un dato preocupante."}, "correct": "A", "wrong": "B", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 125, "pg": [129], "temaKey": "Digestivo", "temaLabel": "Digestivo", "meta": "", "stem": "Varón de 62 años con antecedente de cirrosis hepática asociada a hepatitis por VHC. En los meses previos a su ingreso actual presentaba ascitis y alteraciones en los análisis sanguíneos, destacando: albúmina 2,3 g/dL, actividad de protrombina del 40 %, bilirrubina 4,8 mg/dL; AST 143 UI/L; ALT 230 UI/L. Acude al Servicio de Urgencias por hematemesis. La panendoscopia oral demuestra la existencia de varices esofágicas grado lI/IV, sin hemorragia activa. ¿Cuál, entre las siguientes sería la mejor opción terapéutica?", "opts": {"A": "Esclerosis de las varices y derivación esplenorenal posterior.", "B": "Derivación portocava urgente.", "C": "Ligadura endoscópica con bandas de las varices y valoración de trasplante hepático.", "D": "Devascularización esofagogástrica tipo Sugiura.", "E": "Ligadura endoscópica con bandas y seguimiento con betabloqueantes."}, "correct": "C", "wrong": "E", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 126, "pg": [131, 191], "temaKey": "Digestivo", "temaLabel": "Digestivo", "meta": "MIR 1998 · P233 · 33.8% acierto", "stem": "¿En cuál de estos procesos NO suele hallarse hialina de Mallory (cuerpos de Mallory-Denk) hepatocitaria?", "opts": {"A": "Hepatitis alcohólica.", "B": "Esteatohepatitis no alcohólica.", "C": "Enfermedad de Wilson.", "D": "Toxicidad por amiodarona.", "E": "Hemocromatosis primaria."}, "correct": "E", "wrong": "C", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 127, "pg": [132], "temaKey": "Digestivo", "temaLabel": "Digestivo", "meta": "", "stem": "La hepatopatía alcohólica puede mostrar todos los hallazgos citados, EXCEPTO uno:", "opts": {"A": "Esteatosis macrovesicular.", "B": "Fibrosis pericentral.", "C": "Hepatocitos en vidrio esmerilado positivos con orceína.", "D": "Megamitocondrias.", "E": "Cuerpos de Mallory-Denk citoplasmáticos."}, "correct": "C", "wrong": "D", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 128, "pg": [133, 188], "temaKey": "Digestivo", "temaLabel": "Digestivo", "meta": "MIR 2011 · P205 · 57.4% acierto", "stem": "Un hombre de 56 años diabético y con sobrepeso moderado presenta una discreta hepatomegalia. El enfermo indica que no es bebedor habitual, solo excepcionalmente toma algo de vino. Una biopsia de hígado muestra acúmulos de vacuolas claras citoplásmicas en un 50 % de los hepatocitos. Focos inflamatorios múltiples con neutrófilos, degeneración hialina de Mallory y fibrosis alrededor de las vénulas hepáticas terminales. Señale la respuesta correcta en este caso:", "opts": {"A": "Debe repetirse la biopsia para saber si los cambios son difusos.", "B": "El diagnóstico es de una glucogenosis hepática asociada a la diabetes.", "C": "Los cambios histológicos son irreversibles y acabarán produciendo una cirrosis.", "D": "La lesión está causada claramente por el alcohol a pesar de la negativa del enfermo.", "E": "Es importante disminuir peso y controlar adecuadamente la diabetes para evitar el posible desarrollo de una cirrosis."}, "correct": "E", "wrong": "D", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 129, "pg": [134], "temaKey": "Digestivo", "temaLabel": "Digestivo", "meta": "", "stem": "En un paciente con cirrosis hepática y ascitis, la administración de AINEs está CONTRAINDICADA principalmente porque:", "opts": {"A": "Bloquean el sistema renina-angiotensina.", "B": "Potencian la secreción de aldosterona.", "C": "Inhiben la acción de la hormona antidiurética.", "D": "Reducen la síntesis de factor natriurético.", "E": "Suprimen la vasodilatación renal por prostaglandinas."}, "correct": "E", "wrong": "A", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 130, "pg": [135, 192], "temaKey": "Digestivo", "temaLabel": "Digestivo", "meta": "MIR 1997 · P178 · 64.4% acierto", "stem": "Señale qué afirmación de las siguientes, relativas a la hepatopatía inducida por alcohol, es correcta:", "opts": {"A": "Un 10% de las cirrosis hepáticas alcohólicas se diagnostican inesperadamente en la laparotomía o autopsia.", "B": "La presencia de cuerpos de Mallory en los hepatocitos es específica de la hepatitis alcohólica.", "C": "Más del 60% de los alcohólicos desarrollan cirrosis hepática.", "D": "El hígado graso alcohólico es un precursor constante de la cirrosis alcohólica.", "E": "En los pacientes con hepatitis alcohólica, sin cirrosis preexistente, es excepcional la presencia de ascitis, edema, diátesis hemorrágica o encefalopatía."}, "correct": "A", "wrong": "D", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 131, "pg": [136], "temaKey": "Digestivo", "temaLabel": "Digestivo", "meta": "", "stem": "¿Cuál de los siguientes marcadores bioquímicos se considera el más sensible, aunque poco específico, para detectar el consumo crónico de alcohol?", "opts": {"A": "IgA sérica.", "B": "Gamma-glutamiltransferasa (GGT) sérica.", "C": "Alanina-aminotransferasa (ALT/GPT) sérica.", "D": "Estudios de agregación plaquetaria.", "E": "Bilirrubina indirecta sérica."}, "correct": "B", "wrong": "C", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 132, "pg": [137], "temaKey": "Reumatología", "temaLabel": "Reumatología", "meta": "", "stem": "Entre las manifestaciones extraarticulares de la artritis reumatoide seropositiva, señale la que NO se asocia con la enfermedad:", "opts": {"A": "Uveítis anterior.", "B": "Subluxación atloaxoidea.", "C": "Enfermedad pulmonar intersticial difusa.", "D": "Mononeuritis múltiple."}, "correct": "A", "wrong": "D", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 133, "pg": [138], "temaKey": "Reumatología", "temaLabel": "Reumatología", "meta": "", "stem": "Respecto a la artritis reumatoide, ¿cuál de las siguientes afirmaciones es FALSA?", "opts": {"A": "La determinación de los anticuerpos antipéptido cíclico citrulinado (anti-CCP) tiene valor en el diagnóstico de la artritis reumatoide de inicio.", "B": "La mayoría de las veces, la enfermedad intersticial pulmonar es asintomática.", "C": "Un rasgo característico de la afectación articular periférica es la presencia de un patrón de afectación radial (participación de diversas articulaciones de un mismo dedo, con preservación de las de los otros dedos de manos o pies).", "D": "Los FAME (fármacos modificadores de la enfermedad) tradicionales se asocian con beneficios terapéuticos importantes: mejoran los signos y síntomas y retardan la evolución radiológica.", "E": "La rigidez matutina de larga duración es el síntoma de comienzo más frecuente en la artritis reumatoide, precediendo a la artritis en semanas o incluso meses."}, "correct": "C", "wrong": "B", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 134, "pg": [139], "temaKey": "Reumatología", "temaLabel": "Reumatología", "meta": "", "stem": "En relación con las manifestaciones extraarticulares de la artritis reumatoide es FALSO que:", "opts": {"A": "La atrofia muscular puede ser evidente a las pocas semanas del inicio de la artritis.", "B": "Los nódulos reumatoides suelen aparecer en más del 80% de los pacientes con artritis reumatoide activa.", "C": "Cuando existe derrame pleural, el líquido obtenido por toracocentesis contiene niveles bajos de glucosa incluso en ausencia de infección.", "D": "La pericarditis puede ser asintomática y se asocia con frecuencia a la aparición de derrame pleural.", "E": "Entre el 15 y 20% de los pacientes experimentan un síndrome de Sjögren con la consiguiente queratoconjuntivitis."}, "correct": "B", "wrong": "A", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 135, "pg": [145], "temaKey": "Reumatología", "temaLabel": "Reumatología", "meta": "", "stem": "La artritis reumatoide es más frecuente en familiares de personas que la padecen. Ello es debido auna:", "opts": {"A": "Herencia autosómica dominante.", "B": "Herencia autosómica recesiva.", "C": "Asociación entre susceptibilidad a la enfermedad y determinados alelos HLA de clase I.", "D": "Asociación entre susceptibilidad a la enfermedad y determinados alelos HLA de clase II.", "E": "Asociación entre susceptibilidad a la enfermedad y HLA-DR3."}, "correct": "D", "wrong": "C", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 136, "pg": [147], "temaKey": "Reumatología", "temaLabel": "Reumatología", "meta": "", "stem": "Con respecto a los nódulos reumatoideos de la artritis reumatoide, señale cuál de los siguientes enunciados es FALSO:", "opts": {"A": "Suelen aparecer en más del 80% de los pacientes con artritis reumatoide activa.", "B": "El área del codo es la región más afectada por ellos.", "C": "Parece que el origen de los mismos es un fenómeno de vasculitis.", "D": "Son firmes y adheridos a planos profundos.", "E": "Casi siempre aparecen en individuos positivos para factor reumatoide."}, "correct": "A", "wrong": "C", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 137, "pg": [148], "temaKey": "Reumatología", "temaLabel": "Reumatología", "meta": "", "stem": "En una artritis reumatoide, ¿qué actitud terapéutica tomaría ante una inestabilidad atloaxoidea clínicamente silente?", "opts": {"A": "Tracción craneal.", "B": "Minerva de yeso.", "C": "Collarín, con estratificación radiológica y valoración especializada periódica.", "D": "Intervención quirúrgica estabilizadora.", "E": "Radioterapia antiinflamatoria."}, "correct": "C", "wrong": "D", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 138, "pg": [149], "temaKey": "Reumatología", "temaLabel": "Reumatología", "meta": "", "stem": "Un varón de 68 años con artritis reumatoide de 15 años de evolución presenta un pequeño derrame pleural derecho, asintomático. La ecografía muestra una pequeña cantidad de líquido libre, sin tabiques ni signos de complicación. No presenta fiebre, pérdida de peso ni síntomas respiratorios, y la valoración inicial no sugiere infección ni neoplasia. ¿Cuál de las siguientes es la conducta más apropiada?", "opts": {"A": "Seguimiento clínico y radiológico.", "B": "Toracocentesis evacuadoras periódicas.", "C": "Colocación de un tubo de drenaje pleural.", "D": "Administración de corticoides sistémicos.", "E": "Administración de ciclofosfamida."}, "correct": "A", "wrong": "D", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 139, "pg": [151], "temaKey": "Reumatología", "temaLabel": "Reumatología", "meta": "", "stem": "Hombre de 30 años que acude a consulta por dolor lumbar crónico que empeora en la noche y mejora con el ejercicio. Refiere rigidez matutina de más de una hora. La exploración física revela una disminución de la movilidad en la columna lumbar y dolor a la palpación y exploración de las articulaciones sacroilíacas. La resonancia magnética muestra edema en las articulaciones sacroilíacas compatible con sacroileitis. ¿Cuál es el tratamiento inicial más indicado para este paciente?", "opts": {"A": "Metotrexate subcutáneo semanal.", "B": "Corticoides orales.", "C": "Fisioterapia y antiinflamatorios no esteroides (AINEs).", "D": "Terapia biológica con anti-TNF."}, "correct": "C", "wrong": "D", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 140, "pg": [152], "temaKey": "Reumatología", "temaLabel": "Reumatología", "meta": "", "stem": "Señale cuál de los siguientes signos radiológicos NO es típico de la espondilitis anquilosante:", "opts": {"A": "Cuadratura de los cuerpos vertebrales.", "B": "Calcificación del ligamento vertebral común anterior.", "C": "Sacroileítis.", "D": "Cifosis dorsal."}, "correct": "B", "wrong": "D", "fig": null, "expl": "", "truncated": false, "pre
