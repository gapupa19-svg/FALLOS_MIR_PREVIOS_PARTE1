<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#58cc02">
<title>REPASO FALLOS ⚡️ MIR</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🩺</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --card:#ffffff; --ink:#3c3c3c; --muted:#777; --line:#e5e5e5; --line2:#d0d0d0;
  --green:#58cc02; --green-d:#58a700; --green-bg:#d7ffb8; --green-ink:#4a8c00;
  --red:#ff4b4b; --red-d:#ea2b2b; --red-bg:#ffdfe0; --red-ink:#d33131;
  --blue:#1cb0f6; --blue-d:#1899d6; --blue-bg:#ddf4ff; --blue-line:#84d8ff;
  --orange:#ff9600; --gold:#ffc800; --shadow:#e5e5e5;
  --sel-bg:#ddf4ff; --panel:#f7f7f7;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131f24; --card:#1b2b32; --ink:#e8eef1; --muted:#9db0b8; --line:#2b3f48; --line2:#37505b;
    --green-bg:#1c3a10; --green-ink:#89e219; --red-bg:#3d1c1e; --red-ink:#ff7b7b;
    --blue-bg:#12303f; --blue-line:#1cb0f6; --shadow:#0d161a; --sel-bg:#12303f; --panel:#16252b;
  }
}
:root[data-theme="dark"]{
  --bg:#131f24; --card:#1b2b32; --ink:#e8eef1; --muted:#9db0b8; --line:#2b3f48; --line2:#37505b;
  --green-bg:#1c3a10; --green-ink:#89e219; --red-bg:#3d1c1e; --red-ink:#ff7b7b;
  --blue-bg:#12303f; --blue-line:#1cb0f6; --shadow:#0d161a; --sel-bg:#12303f; --panel:#16252b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-weight:700}
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);min-height:100vh}
button{font-family:inherit;font-weight:800;cursor:pointer}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 140px}
/* top bar */
.topbar{display:flex;align-items:center;gap:12px;padding:8px 0 14px}
.brand{display:flex;align-items:center;gap:8px;font-weight:900;font-size:20px;color:var(--green)}
.brand .logo{width:34px;height:34px;border-radius:10px;background:var(--green);color:#fff;display:grid;place-items:center;font-size:18px;box-shadow:0 3px 0 var(--green-d)}
.chips-top{margin-left:auto;display:flex;gap:8px}
.pill{display:flex;align-items:center;gap:6px;padding:6px 12px;border:2px solid var(--line);border-radius:14px;font-size:14px;font-weight:900;background:var(--card)}
.pill.fire{color:var(--orange)} .pill.xp{color:var(--gold)}
/* home */
.hero{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:18px;margin-bottom:16px}
.hero h1{margin:0 0 4px;font-size:24px;font-weight:900}
.hero p{margin:0;color:var(--muted);font-size:15px;font-weight:700;line-height:1.4}
.bar{height:16px;background:var(--line);border-radius:10px;overflow:hidden;position:relative}
.bar>i{display:block;height:100%;background:var(--green);border-radius:10px;transition:width .4s ease;position:relative}
.bar>i::after{content:"";position:absolute;left:8px;right:8px;top:3px;height:4px;background:rgba(255,255,255,.35);border-radius:4px}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 0}
.stat{border:2px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center;background:var(--card)}
.stat b{display:block;font-size:22px;font-weight:900}
.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:800}
.stat.g b{color:var(--green-d)} .stat.r b{color:var(--red)} .stat.b b{color:var(--blue)}
h2.sec{font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:22px 4px 10px;font-weight:900}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);border-bottom-width:4px;background:var(--card);color:var(--ink);padding:8px 14px;border-radius:14px;font-size:14px;font-weight:800}
.chip.on{border-color:var(--blue-line);background:var(--blue-bg);color:var(--blue)}
.chip small{color:var(--muted);font-weight:800;margin-left:4px}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:15px 18px;font-size:16px;letter-spacing:.8px;text-transform:uppercase;color:#fff;background:var(--green);box-shadow:0 4px 0 var(--green-d);transition:transform .05s, box-shadow .05s}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--green-d)}
.btn.blue{background:var(--blue);box-shadow:0 4px 0 var(--blue-d)} .btn.blue:active{box-shadow:0 0 0}
.btn.red{background:var(--red);box-shadow:0 4px 0 var(--red-d)} .btn.red:active{box-shadow:0 0 0}
.btn.ghost{background:var(--card);color:var(--blue);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)} .btn.ghost:active{box-shadow:0 0 0}
.btn[disabled]{background:var(--line);color:var(--muted);box-shadow:none;cursor:not-allowed;transform:none}
.stack{display:grid;gap:12px;margin-top:14px}
.row{display:flex;gap:10px;align-items:center}
.switch{display:flex;align-items:center;gap:10px;padding:12px 14px;border:2px solid var(--line);border-radius:14px;background:var(--card);font-size:14px;cursor:pointer}
.switch input{width:20px;height:20px;accent-color:var(--green)}
.small{font-size:13px;color:var(--muted);font-weight:700}
/* quiz */
.qtop{display:flex;align-items:center;gap:14px;position:sticky;top:0;background:var(--bg);padding:12px 0;z-index:5}
.x{border:0;background:transparent;color:var(--muted);font-size:26px;line-height:1;padding:4px 6px}
.qtop .bar{flex:1}
.hearts{display:flex;align-items:center;gap:4px;color:var(--red);font-weight:900;font-size:18px}
.tema{font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:var(--blue);font-weight:900;margin:10px 0 8px;line-height:1.35}
.tag{display:inline-block;font-size:11px;font-weight:900;padding:3px 8px;border-radius:8px;margin-right:6px;letter-spacing:.5px}
.tag.retry{background:var(--red-bg);color:var(--red-ink)}
.tag.was{background:var(--blue-bg);color:var(--blue)}
.stem{font-size:19px;line-height:1.5;font-weight:800;margin:0 0 18px}
.opts{display:grid;gap:11px}
.opt{display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;background:var(--card);color:var(--ink);border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;padding:12px 14px;font-size:16px;line-height:1.4;font-weight:800}
.opt .k{flex:0 0 auto;width:28px;height:28px;border:2px solid var(--line2);border-radius:8px;display:grid;place-items:center;font-size:13px;color:var(--muted);font-weight:900;margin-top:1px}
.opt:hover{background:var(--panel)}
.opt.sel{border-color:var(--blue-line);background:var(--sel-bg);color:var(--blue)}
.opt.sel .k{border-color:var(--blue);color:var(--blue)}
.opt.ok{border-color:var(--green);background:var(--green-bg);color:var(--green-ink)}
.opt.ok .k{border-color:var(--green);color:var(--green-d);background:var(--card)}
.opt.bad{border-color:var(--red);background:var(--red-bg);color:var(--red-ink)}
.opt.bad .k{border-color:var(--red);color:var(--red);background:var(--card)}
.opt.dim{opacity:.55}
.opt[disabled]{cursor:default}
.opt.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes pop{0%{transform:scale(.96);opacity:.4}100%{transform:scale(1);opacity:1}}
.opt.pop{animation:pop .25s}
/* feedback sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:10;border-top:2px solid var(--line);background:var(--bg);padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px))}
.sheet .in{max-width:640px;margin:0 auto}
.sheet.ok{background:var(--green-bg);border-color:transparent}
.sheet.bad{background:var(--red-bg);border-color:transparent}
.sheet.tall{max-height:62vh;overflow:auto}
.fb-h{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:900;margin-bottom:6px}
.sheet.ok .fb-h{color:var(--green-ink)} .sheet.bad .fb-h{color:var(--red-ink)}
.fb-ans{font-size:15px;color:var(--red-ink);font-weight:800;margin-bottom:8px;line-height:1.4}
.expl{font-size:14.5px;line-height:1.55;font-weight:700;color:var(--ink);margin:8px 0 14px;white-space:pre-wrap}
.sheet.ok .expl{color:var(--green-ink)} .sheet.bad .expl{color:var(--red-ink)}
.note{font-size:12.5px;color:var(--muted);font-weight:800;margin-bottom:12px}
.sheet .btn.cont{margin-top:4px}
.sheet.ok .btn{background:var(--green);box-shadow:0 4px 0 var(--green-d)}
.sheet.bad .btn{background:var(--red);box-shadow:0 4px 0 var(--red-d)}
.sheet.ok .btn:active,.sheet.bad .btn:active{box-shadow:0 0 0}
/* summary */
.center{text-align:center}
.big{font-size:56px;margin:10px 0 0}
.sum h1{font-size:28px;font-weight:900;margin:6px 0 4px}
.rlist{display:grid;gap:10px;margin-top:10px;text-align:left}
.ritem{border:2px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--card);font-size:14px;line-height:1.45}
.ritem b{color:var(--green-d)}
.ritem .q{color:var(--muted);font-weight:700;margin-bottom:6px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;z-index:30;padding:20px}
.modal{background:var(--bg);border-radius:20px;padding:22px;max-width:380px;width:100%;text-align:center}
.modal h3{margin:8px 0;font-size:22px;font-weight:900}
.modal p{color:var(--muted);margin:0 0 16px;font-weight:700;line-height:1.45}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:40}
.foot{margin:26px 0 0;text-align:center}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:13px}
</style>
</head>

<script>
const QUESTIONS = [{"id": 1, "pg": [1], "temaKey": "Infecciosas", "temaLabel": "Infecciosas", "meta": "MIR 2025 · P201 · 1.3% acierto", "stem": "En la enfermedad por arañazo de gato, señale la INCORRECTA:", "opts": {"A": "En los casos sin manifestaciones sistémicas de la enfermedad es suficiente con tratamiento sintomático.", "B": "Para el diagnóstico es necesaria la práctica de una serología.", "C": "Si se precisa tratamiento antibiótico, se recomienda azitromicina 500 mg en una dosis inicial y 250 mg cada 24 horas durante 4 días más.", "D": "La mayoría de los casos curan de forma espontánea en semanas o meses sin tratamiento de ningún tipo."}, "correct": "B", "wrong": "C", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 2, "pg": [2], "temaKey": "Infecciosas", "temaLabel": "Infecciosas", "meta": "MIR 2018 · P119", "stem": "Mujer de 38 años de edad de profesión veterinaria, encargada de la vigilancia de animales salvajes y de ayudar a partos de ganado doméstico. Comienza con un cuadro de fiebre alta con escalofríos, cefalea, mialgias y tos no productiva que interpreta como un proceso gripal. Acude por presentar dolor torácico. En la radiografía de tórax se objetivan infiltrados pulmonares bilaterales en campos inferiores. Se realiza una prueba serológica con elevación de títulos de anticuerpos frente a antígenos en fase II. ¿Cuál de las siguientes afirmaciones es cierta?", "opts": {"A": "La forma de transmisión de esta entidad es por garrapatas.", "B": "Tanto la doxiciclina como la hidroxicloroquina son eficaces para tratar las formas agudas de esta enfermedad.", "C": "En su forma aguda también presenta, generalmente, elevación de anticuerpos frente a antígenos en fase I.", "D": "La mortalidad en las formas agudas es casi inexistente."}, "correct": "D", "wrong": "C", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 3, "pg": [3], "temaKey": "Infecciosas", "temaLabel": "Infecciosas", "meta": "", "stem": "Un hombre de 31 años que tenía contacto directo con perros, consultó por fiebre y cefalea de 4 días de evolución. Estaba febril y tenía un exantema máculo-papular en cara, tronco y extremidades incluyendo palmas y plantas. Existía una lesión costrosa y negruzca entre las nalgas y adenopatías inguinales. ¿Cuál de los siguientes gérmenes es el responsable?", "opts": {"A": "Borrelia burgdorferi.", "B": "Rickettsia typhi.", "C": "Treponema pallidum.", "D": "Rickettsia conorii.", "E": "Bartonella henselae."}, "correct": "D", "wrong": "A", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 4, "pg": [4], "temaKey": "Infecciosas", "temaLabel": "Infecciosas", "meta": "MIR 2000 (F) · P111 · 83.6% acierto", "stem": "Un veterinario de 40 años consultó por fiebre de 3 semanas de duración con dolor de espalda en los últimos días. Al final de la primera semana había tenido inflamación testicular que cedió con trimetoprim-sulfametoxazol. La exploración era normal salvo por dolor a la percusión en la columna dorsolumbar. Tenía una hemoglobina de 12,2 g/dL, GGT 320 U/L (normal 6-45) y fosfatasa alcalina 230 U/L (normal 41-117). La resonancia nuclear magnética mostraba epifisitis anterior de D12 y signos de espondilodiscitis D12-L1. ¿Cuál debe ser la prueba diagnóstica siguiente en este caso?", "opts": {"A": "Biopsia para cultivo de la médula ósea.", "B": "Punción-aspiración vertebral.", "C": "Hemocultivos y aglutinaciones para Brucella.", "D": "Biopsia hepática.", "E": "Cultivo de orina y de secreción prostática."}, "correct": "C", "wrong": "A", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 5, "pg": [5], "temaKey": "Infecciosas", "temaLabel": "Infecciosas", "meta": "MIR 1998 (F) · P249 · 43.4% acierto", "stem": "La Pasteurella multocida es un bacilo gram-negativo relacionado con mordeduras de animales domésticos. De las siguientes complicaciones, ¿cuál NO produce?", "opts": {"A": "Artritis.", "B": "Infección de tejidos blandos.", "C": "Bacteriemia.", "D": "Gastroenteritis.", "E": "Infección respiratoria crónica."}, "correct": "D", "wrong": "E", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 6, "pg": [6], "temaKey": "Infecciosas", "temaLabel": "Infecciosas", "meta": "MIR 1997 · P116 · 79.8% acierto", "stem": "¿Qué patrón de fiebre, entre los que se mencionan, es el más habitual en la brucelosis NO complicada?", "opts": {"A": "En días alternos.", "B": "Cada tercer día (un día sí y dos no).", "C": "Recurrente (3 a 6 días de fiebre diaria, con intervalos de una semana sin fiebre).", "D": "Continua ondulante (sube y baja, pero no llega a haber apirexia).", "E": "Periódica, con ciclos variables."}, "correct": "D", "wrong": "C", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 7, "pg": [7], "temaKey": "Infecciosas", "temaLabel": "Infecciosas", "meta": "MIR 2026 · P39 · 52.9% acierto", "stem": "En un paciente con infección por el virus de inmunodeficiencia humana (VIH) y alta sospecha de infección respiratoria por micobacterias, una PCR negativa del complejo Mycobacterium tuberculosis en un lavado broncoalveolar no excluye infección por una micobacteria que no pertenece a dicho complejo. ¿Cuál de las siguientes micobacterias NO pertenece al complejo Mycobacterium tuberculosis?", "opts": {"A": "Mycobacterium bovis.", "B": "Mycobacterium tuberculosis.", "C": "Mycobacterium kansasii.", "D": "Mycobacterium africanum."}, "correct": "C", "wrong": "D", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 8, "pg": [8], "temaKey": "Infecciosas", "temaLabel": "Infecciosas", "meta": "MIR 2022 · P175", "stem": "Paciente de 62 años que consulta por haber estado en contacto cercano en las últimas semanas con una persona con una tuberculosis activa. El Mantoux es positivo (12 mm). Entre sus antecedentes destaca estar en tratamiento con anticoagulantes orales (acenocumarol) por una trombosis venosa profunda hace unos meses. No refiere fiebre ni tos y se encuentra asintomático. La radiografía de tórax es normal. ¿Cuál de los siguientes tratamientos es el más recomendable?", "opts": {"A": "Isoniacida, durante nueve meses.", "B": "Rifampicina, durante cuatro meses.", "C": "Isoniacida y rifampicina, durante tres meses.", "D": "Isoniacida y rifapentina, durante tres meses."}, "correct": "A", "wrong": "D", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 9, "pg": [9], "temaKey": "Infecciosas", "temaLabel": "Infecciosas", "meta": "MIR 2015 · P126 · 58.4% acierto", "stem": "La principal indicación para utilizar 4 fármacos en el tratamiento inicial de la tuberculosis es:", "opts": {"A": "Afectación del sistema nervioso central.", "B": "Alta prevalencia de resistencia primaria a isoniacida.", "C": "Tuberculosis pulmonar cavitada y extensa con gran carga bacilar.", "D": "Tuberculosis diseminada asociada a la infección por VIH.", "E": "Tuberculosis extrapulmonar en inmunodeprimidos de cualquier origen."}, "correct": "B", "wrong": "C", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 10, "pg": [10], "temaKey": "Infecciosas", "temaLabel": "Infecciosas", "meta": "MIR 2004 · P132 · 83.4% acierto", "stem": "Mujer de 33 años de edad ecuatoriana, acude a su médico de familia para la lectura de Mantoux, realizado en el contexto de un estudio de contactos. Una prima suya que vive en su casa y duerme en la misma habitación (junto con otras 7 personas), ha sido diagnosticada de una tuberculosis pulmonar bacilífera (más de 50 bacilos por campo). Su médico aprecia una induración de 7 mm en la lectura del PPD. ¿Cuál de las siguientes afirmaciones es la correcta?", "opts": {"A": "Se trata de una infección tuberculosa y hay que iniciar tratamiento quimioprofiláctico de inmediato.", "B": "Se trata de una tuberculosis y hay que comenzar con tratamiento antituberculoso.", "C": "Se trata de una infección tuberculosa y hay que descartar enfermedad tuberculosa, previo a comenzar el tratamiento quimioprofiláctico.", "D": "El PPD no es significativo, ya que al tratarse de una persona inmigrante de una zona de alta prevalencia de TBC debería tener una induración mayor de 10 mm.", "E": "El PPD no es significativo, ya que al tratarse de una persona inmigrante de una zona de alta prevalencia de TBC debería tener una induración mayor de 15 mm."}, "correct": "C", "wrong": "D", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 11, "pg": [11], "temaKey": "Infecciosas", "temaLabel": "Infecciosas", "meta": "MIR 2001 · P95 · 66.6% acierto", "stem": "Un paciente de 60 años con antecedentes de neumoconiosis acude a nuestra consulta por tos y fiebre de 48 horas de duración. A la exploración se detectan estertores en la base derecha. En la placa de tórax se aprecian lesiones compatibles con neumoconiosis simple, engrosamiento pleural apical bilateral y un nuevo infiltrado en el lóbulo pulmonar inferior derecho. La pulsioximetría digital es normal y tiene 14.000 leucocitos/uL. Se realiza un test tuberculínico (PPD) apreciándose una induración de 9 mm. En el esputo no se observan bacilos ácido-alcohol resistentes. El paciente se trata con amoxicilina-clavulánico, la fiebre desaparece y mejora la tos a las 24 horas. ¿Entre las siguientes, cuál es la actitud más correcta?", "opts": {"A": "Mantener dicho tratamiento 10-15 días.", "B": "Mantener dicho tratamiento 1 mes.", "C": "Mantener el tratamiento 10-15 días y administrar isoniazida durante 12 meses, si Lówenstein de esputo es negativo.", "D": "Administrar isoniazida, rifampicina y pirazinamida durante 6 meses.", "E": "Suspender el tratamiento a las 24 horas de desaparecer la fiebre."}, "correct": "C", "wrong": "D", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 12, "pg": [12], "temaKey": "Infecciosas", "temaLabel": "Infecciosas", "meta": "MIR 2000 (F) · P253 · 33.6% acierto", "stem": "Paciente de 25 años con historia de 3 meses de evolución de cansancio progresivo, adelgazamiento, diarrea episódica y febrícula. Presión arterial de 100/60 mmHg, frecuencia cardíaca de 98 lpm, Mantoux +++. Rx de tórax: infiltrado en segmento posterior de lóbulo superior derecho. Inicia tratamiento tuberculostático con 3 drogas (hidrazida, rifampicina y etambutol). Tras dos semanas de tratamiento, el paciente refiere aumento del cansancio, mayor frecuencia de las diarreas y, además, vómitos frecuentes. Presión arterial de 90/60 mmHg en decúbito, 70/50 mmHg en bipedestación. Frecuencia cardíaca de 110 Ipm, con pulso «mollis et parvus». Niega fiebre y síntomas respiratorios. ¿Cuál de las siguientes circunstancias es, con más probabilidad, la causa del cuadro actual?", "opts": {"A": "Error en el diagnóstico inicial.", "B": "Generalización del foco pulmonar inicial.", "C": "Desarrollo de hepatitis tóxica por hidrazida.", "D": "Desarrollo de una colitis seudomembranosa.", "E": "Presencia de insuficiencia suprarrenal desenmascarada por rifampicina."}, "correct": "E", "wrong": "C", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 13, "pg": [13], "temaKey": "Infecciosas", "temaLabel": "Infecciosas", "meta": "MIR 1998 (F) · P123 · 34.4% acierto", "stem": "Paciente gestante de 26 semanas en la que se realiza el diagnóstico de tuberculosis pulmonar. ¿Cuál de las siguientes respuestas es correcta?", "opts": {"A": "Dada la evolución más lenta de la tuberculosis durante el embarazo, es preferible instaurar el tratamiento tras el parto.", "B": "La estreptomicina puede utilizarse sin riesgo.", "C": "El etambutol es un fármaco contraindicado por el riesgo de neuritis óptica en el feto.", "D": "La isoniazida es inocua durante el embarazo.", "E": "Se instaurará tratamiento durante 6 meses con pirazinamida, rifampicina y piridoxina."}, "correct": "D", "wrong": "E", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 14, "pg": [14], "temaKey": "Infecciosas", "temaLabel": "Infecciosas", "meta": "MIR 1998 (F) · P211 · 67.6% acierto", "stem": "Señale la respuesta FALSA en relación con la prueba tuberculínica (Mantoux):", "opts": {"A": "Existen falsos positivos por vacunación BCG.", "B": "Las positividades dudosas pueden ser debidas a infecciones por otras micobacterias.", "C": "La positividad se mide por la induración.", "D": "Pueden existir falsos negativos por causas técnicas.", "E": "La tuberculina mide el grado de inmunidad frente a la tuberculosis."}, "correct": "E", "wrong": "B", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 15, "pg": [15], "temaKey": "Infecciosas", "temaLabel": "Infecciosas", "meta": "MIR 1998 · P246 · 74.8% acierto", "stem": "Respecto a la epidemiología y relevancia clínica de las infecciones por micobacterias en la población general y en pacientes con infección por VIH, ¿cuál de las siguientes es correcta?", "opts": {"A": "Mycobacterium tuberculosis es la micobacteria patógena de mayor importancia epidemiológica a nivel mundial.", "B": "El complejo Mycobacterium avium (MAC) presenta una incidencia global superior a la de M. tuberculosis.", "C": "Mycobacterium bovis constituye la principal causa de enfermedad micobacteriana extrapulmonar en adultos.", "D": "Mycobacterium genavense es el microorganismo responsable de la mayoría de las micobacteriosis diseminadas en pacientes con infección avanzada por VIH.", "E": "En individuos inmunocompetentes, la incidencia de infección por MAC es similar a la de M. tuberculosis."}, "correct": "A", "wrong": "B", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 16, "pg": [16], "temaKey": "Infecciosas", "temaLabel": "Infecciosas", "meta": "MIR 1997 (F) · P111 · 83.6% acierto", "stem": "El diagnóstico de la presencia de infección tuberculosa se establece mediante:", "opts": {"A": "Prueba de tuberculina (Mantoux) o IGRA.", "B": "Radiografía de tórax.", "C": "Estudio histológico de material de biopsia.", "D": "Estudio microbiológico de muestras clínicas.", "E": "Cultivo de BAAR en orina, si no hay una lesión localizada."}, "correct": "A", "wrong": "D", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 17, "pg": [17], "temaKey": "Infecciosas", "temaLabel": "Infecciosas", "meta": "MIR 1996 · P84 · 64% acierto", "stem": "En relación con la prueba de la tuberculina, señale cuál de las siguientes afirmaciones es INCORRECTA:", "opts": {"A": "La reacción está mediada por linfocitos T.", "B": "La positividad es una evidencia de infección tuberculosa pasada o actual.", "C": "Es negativa en un cierto porcentaje con tuberculosis activa.", "D": "Se practica mediante inyección subcutánea en el antebrazo.", "E": "El resultado es muy frecuentemente negativo en inmunodeprimidos."}, "correct": "D", "wrong": "B", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 18, "pg": [18], "temaKey": "Infecciosas", "temaLabel": "Infecciosas", "meta": "MIR 1991 · P166 · 83.1% acierto", "stem": "La porción de tracto genital que con mayor frecuencia se afecta en la tuberculosis genital es:", "opts": {"A": "El cuello uterino.", "B": "Endometrio.", "C": "Las trompas.", "D": "Los ovarios.", "E": "La vagina."}, "correct": "C", "wrong": "B", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 19, "pg": [19], "temaKey": "Infecciosas", "temaLabel": "Infecciosas", "meta": "MIR 1990 · P199 · 48.7% acierto", "stem": "¿Cuál de las siguientes manifestaciones NO corresponde a una primoinfección tuberculosa activa?", "opts": {"A": "Hiperplasia de nódulos linfáticos mediastínicos.", "B": "Eritema indurado de Bazin.", "C": "Neumonía.", "D": "Meningitis.", "E": "Enfermedad miliar."}, "correct": "B", "wrong": "E", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 20, "pg": [20], "temaKey": "Infecciosas", "temaLabel": "Infecciosas", "meta": "MIR 2000 (F) · P120 · 33.8% acierto", "stem": "La candidiasis hepatoesplénica ocurre habitualmente en:", "opts": {"A": "Pacientes con SIDA.", "B": "Diabéticos tipo 1 con neuropatía avanzada.", "C": "Receptores de trasplante hepático en el período postrasplante precoz.", "D": "Pacientes con leucemia aguda y leucopenia prolongada en fase de resolución.", "E": "Pacientes con cirugía pancreática mayor y con nutrición parenteral."}, "correct": "D", "wrong": "A", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 21, "pg": [21], "temaKey": "Infecciosas", "temaLabel": "Infecciosas", "meta": "MIR 1994 · P107 · 85.5% acierto", "stem": "La mucormicosis rinocerebral afecta principalmente a pacientes con:", "opts": {"A": "Sida.", "B": "Neutropenia postquimioterapia.", "C": "Diabetes mellitus.", "D": "Anemia de células falciforme.", "E": "Carcinoma nasofaringeo."}, "correct": "C", "wrong": "B", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 22, "pg": [22], "temaKey": "Infecciosas", "temaLabel": "Infecciosas", "meta": "MIR 2025 · P172 · 52.1% acierto", "stem": "Hombre de 37 años con infección VIH ha dejado de tomar el tratamiento por razones personales hace 3 meses; estaba tomando una combinación de dos inhibidores de transcriptasa inversa y un inhibidor de la integrasa. En la evaluación llevada a cabo en este momento tiene 120 linfocitos CD4/UL y una carga viral de VIH-1 de 80.000 copias/mL. Estamos pendientes del estudio de resistencias. ¿Qué debemos recomendarle en este momento?", "opts": {"A": "Reiniciar el tratamiento con lo mismo con lo que estaba previamente.", "B": "Esperar a tener el resultado del estudio de resistencias para orientar el tipo de tratamiento en función de las mutaciones identificadas.", "C": "Prescribir a partir de ahora un régimen basado en inhibidores de proteasa por su mayor barrera genética a las resistencias.", "D": "Iniciar doble terapia con inhibidores de integrasa."}, "correct": "A", "wrong": "B", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 23, "pg": [23], "temaKey": "Infecciosas", "temaLabel": "Infecciosas", "meta": "", "stem": "Varón de 56 años con antecedentes de infección por VIH diagnosticada hace unos meses, que es encontrado confuso, desorientado y con hemiparesia derecha. La familia refiere que presenta una pérdida significativa de peso en los últimos 6 meses, así como diarrea frecuente. No ha comenzado tratamiento antirretroviral por deseo personal. Los análisis muestran una carga viral de VIH-1 de 600.000 copias/mL, 130 linfocitos CD4, 900 linfocitos totales y un cociente CD4/CD8 de 0,1. La serología a toxoplasma, la carga viral de CMV y el antígeno criptocócico en sangre son negativos. La RM cerebral se muestra en la figura. ¿Cuál es el diagnóstico más probable?", "opts": {"A": "Toxoplasmosis cerebral.", "B": "Linfoma primario del sistema nervioso central.", "C": "Leucoencefalopatía multifocal progresiva.", "D": "Encefalitis por CMV."}, "correct": "B", "wrong": "A", "fig": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozv/wAARCABvAoADASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwD2RmxwOtNyf7xoP3j9aKYgyf7xoyf7xoooAMn+8aMn+8aKKADJ/vGjJ/vGiigAyf7xoyf7xoooAMn+8aMn+8aKKADJ/vGjJ/vGiigAyf7xoyf7xoooAMn+8aMn+8aKKADJ/vGjJ/vGiigAyf7xoyf7xoooA8c8f/FDxL4b8Y3mlae9r9nhCFfMh3NygJ5z6muc/wCF2+Mf+ell/wCA/wD9eqXxe/5KTqX+7F/6LWuKpDPQv+F2+Mf+ell/4D//AF6P+F2+Mf8AnpZf+A//ANevPaKAPQv+F2+Mf+ell/4D/wD16P8AhdvjH/npZf8AgP8A/Xrz2igD0L/hdvjH/npZf+A//wBej/hdvjH/AJ6WX/gP/wDXrz2i LSdx9aAP/9k=", "expl": "", "truncated": false, "prevOk": false}, {"id": 24, "pg": [24], "temaKey": "Infecciosas", "temaLabel": "Infecciosas", "meta": "MIR 2016 · P107 · 3.6% acierto", "stem": "Un paciente con infección por VIH avanzada, sin antecedentes neurológicos previos, consulta por una primera crisis convulsiva. En la valoración inicial no hay fiebre, cefalea intensa ni signos meníngeos, y la exploración muestra un déficit neurológico focal de instauración progresiva. ¿Cuál de las siguientes etiologías es MENOS probable?", "opts": {"A": "Leucoencefalopatía multifocal progresiva.", "B": "Meningitis criptocócica.", "C": "Encefalopatía por VIH.", "D": "Linfoma primario del sistema nervioso central."}, "correct": "A", "wrong": "B", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 25, "pg": [25], "temaKey": "Infecciosas", "temaLabel": "Infecciosas", "meta": "", "stem": "Señale la afirmación correcta en relación con la circuncisión y la prevención de la transmisión de la infección por VIH:", "opts": {"A": "En África se ha mostrado eficaz en la prevención de la transmisión de la mujer al hombre.", "B": "Reduce la transmisión tras relaciones homosexuales entre hombres.", "C": "Incrementa la transmisión del VIH del hombre a la mujer.", "D": "El balance coste-beneficio es desfavorable en países subdesarrollados.", "E": "Se recomienda generalizar el procedimiento para reducir las tasas de transmisión en todo el mundo."}, "correct": "A", "wrong": "B", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 26, "pg": [26], "temaKey": "Infecciosas", "temaLabel": "Infecciosas", "meta": "", "stem": "Hombre de 35 años, con antecedentes de infección por VIH, que acude al servicio de urgencias por presentar fiebre, tos y esputos manchados de sangre de varias semanas de evolución. En una determinación reciente la cifra de linfocitos CD4 era de 166 cel./uL. La placa de tórax muestra un infiltrado en el LID y en la tinción de esputo se observan bacilos ácidoalcohol resistentes. Al valorar este paciente, ¿cuál de las siguientes respuestas le parece correcta?", "opts": {"A": "Al tratarse de un paciente inmunodeprimido, precisa tratamiento con 4 drogas antituberculosas independientemente de la incidencia de resistencias a isoniacida en la comunidad.", "B": "La elección del tratamiento antirretroviral no afecta al tratamiento antituberculoso.", "C": "La afectación de lóbulos inferiores hace más probable la infección pulmonar por Mycobacterium avium (MAC).", "D": "Se debería esperar el resultado del cultivo de micobacterias para iniciar tratamiento.", "E": "Es muy probable que la infección pulmonar coincida con alguna afectación extrapulmonar."}, "correct": "E", "wrong": "A", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 27, "pg": [27], "temaKey": "Infecciosas", "temaLabel": "Infecciosas", "meta": "", "stem": "Todas las siguientes afirmaciones referidas al virus de la inmunodeficiencia humana (VIH), excepto una, son correctas. Señale la respuesta INCORRECTA:", "opts": {"A": "La proteína CD4 de la superficie de las células T es el receptor para el virus.", "B": "Los pacientes infectados por el virus producen anticuerpos frente a las glucoproteínas (gp120 y gp41) de la envuelta y el antígeno interno grupo específico (p24).", "C": "La prueba de Western blot es más específica que el ELISA para diagnosticar la infección por el virus.", "D": "Un problema importante para estudiar los anticuerpos frente al VIH es su reactividad cruzada con el virus linfotrópico I de células T humanas.", "E": "Existe una importante diversidad antigénica en las glucoproteínas de la envoltura del VIH."}, "correct": "D", "wrong": "E", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 28, "pg": [28], "temaKey": "Infecciosas", "temaLabel": "Infecciosas", "meta": "", "stem": "Un paciente infectado por el VIH recibe tratamiento antirretroviral con AZT + 3TC + efavirenz desde hace 14 meses. La última determinación de linfocitos CD4 y carga viral era de 350/uL y <200 copias/mL, respectivamente. Consulta por disnea y palidez y se constata una anemia microcítica (hemoglobina 7,8 g/dL, VCM 68 fL). El diagnóstico más probable es:", "opts": {"A": "Crisis aplástica por parvovirus B19.", "B": "Leishmaniasis diseminada.", "C": "Infección diseminada por Mycobacterium avium-intracellulare.", "D": "Toxicidad farmacológica.", "E": "Hemorragia digestiva crónica."}, "correct": "E", "wrong": "D", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 29, "pg": [29], "temaKey": "Infecciosas", "temaLabel": "Infecciosas", "meta": "", "stem": "En cuanto a la neumonía por neumococo en pacientes infectados por el virus de la inmunodeficiencia humana (VIH) es FALSO que:", "opts": {"A": "Es una infección frecuentemente bacteriémica.", "B": "Tiene mayor incidencia que en la población general.", "C": "Junto a Haemophilus influenzae es la causa más común de neumonía en pacientes con SIDA.", "D": "Se recomienda vacuna neumocócica en aquellos pacientes con CD4 < 100 células/pL.", "E": "Esta neumonía puede ser vista en pacientes con sistema inmune relativamente intacto."}, "correct": "D", "wrong": "E", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 30, "pg": [30], "temaKey": "Infecciosas", "temaLabel": "Infecciosas", "meta": "", "stem": "Un paciente diagnosticado de infección por VIH se presenta por primera vez en la consulta con candidiasis oral. Aporta CD4 de 123 células/pL y carga viral de 50.000 copias/mL. ¿Cuál de las siguientes actitudes NO es correcta?", "opts": {"A": "Iniciar tratamiento antirretroviral combinado, preferentemente con un esquema basado en inhibidor de la integrasa.", "B": "Iniciar profilaxis frente a Pneumocystis jirovecii.", "C": "Cribar infección tuberculosa latente.", "D": "Iniciar zidovudina y ampliar el tratamiento si no desciende la carga viral.", "E": "Programar seguimiento clínico y analítico tras iniciar el tratamiento."}, "correct": "D", "wrong": "A", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 31, "pg": [31], "temaKey": "Infecciosas", "temaLabel": "Infecciosas", "meta": "", "stem": "Señale cuál de los siguientes hechos histológicos NO aparece, generalmente, en las adenomegalias del sida:", "opts": {"A": "Hiperplasia folicular florida.", "B": "Depleción linfocitaria.", "C": "Respuesta B-monocitoide sinusal.", "D": "Hiperplasia angiofolicular tipo Castleman.", "E": "Respuesta angioinmunoblástica del área T."}, "correct": "B", "wrong": "A", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 32, "pg": [32], "temaKey": "Infecciosas", "temaLabel": "Infecciosas", "meta": "", "stem": "Un paciente con infección por VIH, con inmunodepresión severa, acude al servicio de urgencias refiriendo disminución de la agudeza visual. En el examen del fondo de ojo presenta hallazgos típicos de retinitis por citomegalovirus. La analítica muestra glucosa 82 mg/aL, creatinina 0,7 mg/dL, 1.100 leucocitos/pL con 70% de segmentados, 15% de linfocitos y 12% de monocitos; 58.000 plaquetas/uL, Hb de 8,5 g/dL y hematocrito del 27%. ¿Cuál sería el tratamiento de elección para iniciar el tratamiento de la retinitis por citomegalovirus en este caso?", "opts": {"A": "Ganciclovir ¡.v.", "B": "No es preciso ningún tratamiento.", "C": "Anfotericina B ¡.v.", "D": "Foscarnet ¡.v.", "E": "Zidovudina i.v."}, "correct": "D", "wrong": "A", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 33, "pg": [33], "temaKey": "Infecciosas", "temaLabel": "Infecciosas", "meta": "", "stem": "Entre las siguientes situaciones, señale la que es MENOS probable que suponga la necesidad de intervención quirúrgica en pacientes con SIDA:", "opts": {"A": "Mediastinitis por perforación esofágica.", "B": "Peritonitis por perforación intestinal.", "C": "Obstrucción intestinal por linfoma digestivo.", "D": "Hemorragia gastrointestinal por citomegalovirus (CMV).", "E": "Infecciones intraabdominales o retroperitoneales por micobacterias y otros microorganismos oportunistas."}, "correct": "A", "wrong": "D", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 34, "pg": [34], "temaKey": "Infecciosas", "temaLabel": "Infecciosas", "meta": "", "stem": "En un paciente con SIDA avanzado, ¿cuál de los siguientes procesos abdominales agudos puede estar relacionado de forma característica con infecciones oportunistas o neoplasias asociadas a su inmunodepresión?", "opts": {"A": "Apendicitis aguda común.", "B": "Cólico biliar no complicado.", "C": "Perforación de intestino delgado.", "D": "Perforación de úlcera gástrica por AINEs.", "E": "Diverticulitis aguda sigmoidea."}, "correct": "C", "wrong": "E", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 35, "pg": [35], "temaKey": "Infecciosas", "temaLabel": "Infecciosas", "meta": "", "stem": "¿Cuál de las siguientes afirmaciones referentes a la neumonía por Pneumocystis jirovecii en pacientes con SIDA es FALSA?", "opts": {"A": "La radiografía de tórax puede ser normal.", "B": "El tratamiento profiláctico con cotrimoxazol solo debe iniciarse tras el primer episodio de neumonía.", "C": "Los esteroides forman parte del tratamiento a considerar en esta infección.", "D": "El cuadro clínico puede ser indolente, de semanas de evolución.", "E": "El tiempo medio de mejoría clínica con tratamiento correcto es de 7 días."}, "correct": "B", "wrong": "E", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 36, "pg": [36], "temaKey": "Infecciosas", "temaLabel": "Infecciosas", "meta": "", "stem": "En los pacientes con SIDA se ha señalado que la afectación extrapulmonar por el Pneumocystis jirovecii se relaciona con:", "opts": {"A": "Número de linfocitos T4 inferior a 200/uL.", "B": "Enfermedad pulmonar previa.", "C": "Uso de pentamidina en aerosol.", "D": "Insuficiente dosificación del cotrimoxazol.", "E": "Homosexualidad."}, "correct": "C", "wrong": "A", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 37, "pg": [37], "temaKey": "Infecciosas", "temaLabel": "Infecciosas", "meta": "", "stem": "En un paciente infectado por el VIH, ¿cuál de los siguientes hallazgos clínicos se asocia con mayor probabilidad a una inmunodepresión avanzada?", "opts": {"A": "Candidiasis orofaríngea.", "B": "Fiebre aislada.", "C": "Artralgias.", "D": "Exantema maculopapular.", "E": "Meningitis aséptica."}, "correct": "A", "wrong": "E", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 38, "pg": [38], "temaKey": "Infecciosas", "temaLabel": "Infecciosas", "meta": "", "stem": "Paciente con infección por VIH y CD4 de 80/uL que consulta por fiebre, tos seca y disnea progresiva. Presenta infiltrados intersticiales bilaterales, se identifica Pneumocystis jirovecii en esputo inducido y la PaO, basal es de 55 mmHg. Tiene antecedente de reacción cutánea grave a cotrimoxazol. ¿Cuál sería el tratamiento antimicrobiano más adecuado?", "opts": {"A": "Pentamidina inhalada.", "B": "Primaquina asociada a clindamicina por vía oral.", "C": "Pentamidina intravenosa.", "D": "Cotrimoxazol a dosis bajas.", "E": "Atovacuona oral."}, "correct": "B", "wrong": "C", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 39, "pg": [39], "temaKey": "Infecciosas", "temaLabel": "Infecciosas", "meta": "", "stem": "En relación con el trastorno neurocognitivo asociado al VIH, señale la afirmación INCORRECTA:", "opts": {"A": "Es mucho más frecuente en HSH que en otros pacientes con VIH.", "B": "El LCR puede mostrar pleocitosis leve y aumento de proteínas.", "C": "La RM muestra atrofia cerebral y alteraciones inespecíficas de sustancia blanca.", "D": "El tratamiento antirretroviral puede mejorar o estabilizar el deterioro funcional.", "E": "El diagnóstico requiere descartar otras causas de deterioro cognitivo."}, "correct": "A", "wrong": "D", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 40, "pg": [40], "temaKey": "Infecciosas", "temaLabel": "Infecciosas", "meta": "", "stem": "Un paciente de 30 años portador del virus de la inmunodeficiencia humana acude a la consulta por tos seca y disnea de grandes esfuerzos, sin fiebre. En un análisis practicado hace 15 días la cifra de linfocitos CD4 era de 650/ pL. ¿Cuál es la actitud clínica a tomar?", "opts": {"A": "Es muy probable que tenga una neumonía por Pneumocystis jirovecii y debe realizarse urgentemente una radiografía de tórax, independientemente de los resultados de la exploración física.", "B": "La exploración clínica nos orientará si la práctica de una radiografía de tórax está indicada. Dada su cifra de linfocitos CD4, una enfermedad oportunista es altamente improbable.", "C": "Independientemente de su enfermedad aguda está indicado realizar un tratamiento profiláctico con trimetoprima- sulfametoxazol, pues los CD4 son inferiores a 700/uL.", "D": "El primer diagnóstico a tener en cuenta en este caso es la tuberculosis pulmonar.", "E": "No existen motivos para pensar en una enfermedad por Pneumocystis pues la profilaxis se acepta universalmente que debe iniciarse por debajo de 500 CD4/pL con trimetoprima-sulfametoxazo!l."}, "correct": "B", "wrong": "A", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 41, "pg": [41], "temaKey": "Infecciosas", "temaLabel": "Infecciosas", "meta": "", "stem": "A un paciente de Bolivia diagnosticado de enfermedad de Chagas se le realiza un hemograma que muestra 1.100 eosinófilos/uL (12% de los leucocitos). ¿Cuál de los siguientes diagnósticos es el MENOS probable?", "opts": {"A": "Infección por Schistosoma haematobium.", "B": "Infección por Ancylostoma duodenale.", "C": "Infección por Strongyloides stercoralis.", "D": "Infección por Ascaris lumbricoides.", "E": "Infección por Necator americanus."}, "correct": "A", "wrong": "D", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 42, "pg": [42], "temaKey": "Infecciosas", "temaLabel": "Infecciosas", "meta": "", "stem": "Trichomonas vaginalis se transmite principalmente por contacto sexual directo, aunque de forma excepcional puede sobrevivir durante algunas horas en ambientes húmedos. Su escasa resistencia ambiental se explica porque:", "opts": {"A": "No forma quistes resistentes, por lo que sobrevive mal fuera del huésped.", "B": "No afecta la uretra del varón y por ello el inóculo es mínimo.", "C": "Es inmóvil y no alcanza el cérvix vaginal.", "D": "Es anaerobia estricta y muere de forma inmediata por acción del oxígeno.", "E": "Carece de cápsula, por lo que no puede sobrevivir en mucosas."}, "correct": "A", "wrong": "E", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 43, "pg": [43, 53], "temaKey": "Infecciosas", "temaLabel": "Infecciosas", "meta": "MIR 2005 · P230 · 67% acierto", "stem": "La diferencia entre Entamoeba histolytica y Entamoeba dispar (patógena y comensal respectivamente) se hace en los laboratorios de microbiología clínica por:", "opts": {"A": "Estudio de las diferencias morfológicas (microscópica) con ayuda de una tinción permanente.", "B": "Estudio de las diferencias metabólicas (galería metabólica).", "C": "Estudio de sus diferencias antigénicas mediante pruebas inmunológicas.", "D": "Estudio de las características diferenciales de la movilidad (pseudópodos).", "E": "Tan solo puede establecerse mediante secuenciación del ARNt."}, "correct": "C", "wrong": "E", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 44, "pg": [44], "temaKey": "Infecciosas", "temaLabel": "Infecciosas", "meta": "", "stem": "Señale cuál de las siguientes asociaciones de helmintos y su clínica característica es INCORRECTA:", "opts": {"A": "Ascaris lumbricoides - Síndrome de Löffler.", "B": "Onchocerca volvulus - Ceguera de los ríos.", "C": "Ancylostoma duodenale - Anemia megaloblástica.", "D": "Strongyloides stercoralis - Síndrome de hiperinfestación en inmunodeprimidos.", "E": "Taenia solium - Convulsiones generalizadas."}, "correct": "C", "wrong": "E", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 45, "pg": [45], "temaKey": "Infecciosas", "temaLabel": "Infecciosas", "meta": "", "stem": "¿Cuál es el fármaco de elección para el tratamiento de la infección por Taenia saginata?", "opts": {"A": "Albendazol.", "B": "Pamoato de pirantel.", "C": "Metronidazol.", "D": "Ivermectina.", "E": "Praziquantel."}, "correct": "E", "wrong": "D", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 46, "pg": [46], "temaKey": "Infecciosas", "temaLabel": "Infecciosas", "meta": "MIR 2019 · P83", "stem": "Hombre de 40 años que viaja por turismo al Caribe. A la semana de su regreso presenta de 3 a 4 deposiciones líquidas diarias, acuosas, sin productos patológicos, así como dolor abdominal y malestar general. El médico que le atiende le prescribe hidratación oral y le propone la administración de una quinolona. ¿Con qué finalidad?", "opts": {"A": "Acortar la duración de la diarrea.", "B": "Disminuir la mortalidad.", "C": "Evitar la aparición de complicaciones intraabdominales.", "D": "Evitar la diseminación séptica a distancia."}, "correct": "A", "wrong": "C", "fig": null, "expl": "", "truncated": false, "prevOk": false}, {"id": 47, "pg": [47], "temaKey": "Infecciosas", "temaLabel": "Infecciosas", "meta": "", "stem": "Un paciente de 25 años consulta por una clínica de fiebre de hasta 39 °C y diarrea de unos 5 días de evolución. Explica que hace 2 meses realizó un viaje de tres semanas por diversas zonas rurales de la India. Asegura que hizo profilaxis con mefloquina semanal antes, durante y 4 semanas después del viaje, sin olvidar ninguna toma. Entre las diversas pruebas se realiza una extensión de sangre periférica cuyos hallazgos se muestran en la imagen adjunta. ¿Cuál es la mejor de las siguientes afirmaciones?", "opts": {"A": "Se pueden apreciar 2 trofozoitos de P.", "B": "Se observan varios granulocitos en diferentes estadios de maduración.", "C": "Lo más sugestivo es que se trate de esquizontes de P. falciparum.", "D": "Se observan hematíes fragmentados y cuerpos de Howell-Jolly.", "E": "Se trata de eritroblastos circulantes."}, "correct": "A", "wrong": "C", "fig": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozv/wAARCAGOAn8DASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwD2Rm200sx74oblz7UUAJlv736UZb+9+lLRTEJlv736UZb+9+lLRQAmW/vfpXnPij4j6vofia60u3tLSSKHbtaQNuOVB5wfevR68P8AiCAPHOonv+7/APQFqo2vqM20+K+st1srL8m/xqWP4o6w5ANlafk3+NcLFGQBmrltGS2TSb7DSO6j+ImrvybS1A+jf41KPiBqp/5dbXP0b/GuViXCgYqZEGc5rNstRR0//Ce6ocAWtvn6N/jUqeONRP3oLf8AI/41z6RjbkCnxwZPSs+ZlcqOkXxpeHrDCPwNTxeLLmUgeXEPwNcpJGVNELsripcpdGO0ex2p8QXWOEjz9DS/29dYzsj/ACNY1s2+MNUx5rF1J9yuSJpf2/dk42RfkaX+37v+5H+RrLGM0jEAd6ftJdxciNM+ILsDOyL8jSf8JFef884vyNZuQV6YoC5OaPaT7hyR7F2XxHqKjMcMB+oP+NVj4t1QHBt4PyP+NMxQwX+6CapVZdRciJU8V6o5AFvD+R/xq0viK/xloofwB/xqiqgDpinhR1pOrJhyItDxHfZ/1UP5H/GpU8QXTD7kf5Gs0jLcdKTBBpe0l3DliXrrxLd26ZEcRPuDWf8A8JrqG7Agg/I/41T1HJXHassfK2TWsZya3Fyo6MeMdQP/ACwg/I/40jeNL9f+WEH5H/GsmKJJFySKinhC+lPnYciOgtvF19OeYYB9Af8AGr66/dEZMcY/A1xtvJ5UgIrZjvEcAEYrNzmmUoRZbufFt/C+FghI9warf8JtqH/PvB+R/wAap3ke45GCKoCIE1opuxPKjb/4TXUT0gt/yP8AjTh4z1In/UW/5H/GsXygO2aCnYCnzsOVHS2vii9nbDRQj6A/41dOt3X92P8AI1zlim05PAq8Z41PLCsXUl3L5FY1Rrl0Rykf5Gj+3Lkfwx/lWYsiv0YfnS4xS9rLuLk
